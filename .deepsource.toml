version = 1

test_patterns = [
  "**/apps/api/**/*.spec.ts",
  "**/apps/api/**/*.e2e-spec.ts",
  "**/web/e2e/**/*.spec.ts",
]

exclude_patterns = [
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/.next/**",
  "**/coverage/**",
  "**/out/**",
  "**/.pytest_cache/**",
]

[[analyzers]]
name = "docker"
enabled = true

[[analyzers]]
name = "javascript"
# `enabled = false` here does NOT actually turn this analyzer off -- confirmed
# empirically: `deepsource repo status` still lists it active, and a PR
# touching JS/TS still gets the full flood, even with this file (and this
# exact setting) live on main. This repo's DeepSource analyzer config is
# dashboard-managed, not read from this file at all, on any branch. Actually
# disabling the analyzer (or fixing module_system below, which has the same
# problem) requires the DeepSource web dashboard:
# https://app.deepsource.com/gh/MGM-Laboratory/mgm-website/settings
# The main-protection ruleset already excludes "DeepSource: JavaScript" from
# required checks as the working mitigation. The settings below are what this
# analyzer actually needs, for whoever fixes this from the dashboard.
enabled = true

  [analyzers.meta]
  dialect = "typescript"
  module_system = "es-modules"
  style_guide = "airbnb"
  cyclomatic_complexity_threshold = "high"

[[analyzers]]
name = "sql"
enabled = true

  [analyzers.meta]
  comma_style = "trailing"
  indent_unit = "space"
  allow_scalar = true
  tab_space_size = 4
  max_line_length = 80
  capitalisation_policy = "consistent"
  single_table_references = "consistent"

[[analyzers]]
name = "secrets"
enabled = true
