packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Both are transitive deps of prisma, pinned to patched versions for known
  # advisories: mysql2 is a dormant multi-database driver this project's
  # postgresql-only usage never exercises. deepmerge-ts is not dormant,
  # @prisma/config calls it directly while loading configuration regardless
  # of provider, so it's a real vulnerable dependency, not a dead one.
  # Exact versions on purpose, not a >= range, so a routine lockfile
  # refresh can't silently pull in an unreviewed future major.
  mysql2: "3.24.4"
  deepmerge-ts: "8.0.2"
  # Transitive dev tool dependencies with open advisories. vitest accepts any
  # vite from 6 to 8, so pnpm kept the older 8.2.2. eslint tooling takes
  # minimatch 10, and the fix is in 11. Exact versions on purpose, like above.
  vite: "8.2.6"
  "minimatch@^10": "11.0.8"
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  prisma: true
  unrs-resolver: true
