packages:
  - "apps/*"
  - "packages/*"
overrides:
  # Prisma bundles these regardless of database provider; both are below
  # patched versions for known advisories. Neither is exercised by this
  # project's postgresql-only usage, but pin them past the fix anyway.
  mysql2: ">=3.23.1"
  deepmerge-ts: ">=8.0.0"
allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  prisma: true
  unrs-resolver: true
