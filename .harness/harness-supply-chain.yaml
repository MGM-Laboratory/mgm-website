pipeline:
  name: harness-supply-chain
  identifier: harness_supply_chain
  projectIdentifier: default_project
  orgIdentifier: default
  variables:
    - name: commit_sha
      type: String
      default: main
      value: <+input>
  stages:
    - stage:
        name: sbom-and-policy
        identifier: sbom_and_policy
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: checkout
                  identifier: checkout
                  spec:
                    shell: Sh
                    command: |-
                      set -eu
                      git clone --quiet https://github.com/MGM-Laboratory/mgm-website.git repo
                      cd repo
                      git checkout --quiet "<+pipeline.variables.commit_sha>"
              - step:
                  type: Run
                  name: sbom
                  identifier: sbom
                  spec:
                    shell: Sh
                    image: anchore/syft:latest
                    command: |-
                      set -eu
                      syft dir:repo -o cyclonedx-json=repo-sbom.cdx.json
                      cat repo-sbom.cdx.json | head -c 500
              - step:
                  type: Run
                  name: vulnerability-policy-gate
                  identifier: vulnerability_policy_gate
                  spec:
                    shell: Sh
                    image: anchore/grype:latest
                    command: |-
                      set -eu
                      grype dir:repo --fail-on critical
