# SonarCloud runs via the GitHub App's Automatic Analysis (no CI workflow
# invokes a scanner) — this file is how repo-local analysis settings are
# configured, since there's nowhere else to put them.
#
# apps/web/src/data/about-sources.ts is a literal citation register: ~28
# `{ id, title, url }` records. Copy-paste detection flags consecutive
# structurally-identical object literals as duplication (88% duplicated
# lines measured on this one file), but there's no logic to deduplicate —
# it's tabular data, and any alternative shape (tuples, a single template
# string) hits the same line-based heuristic while being less readable and
# losing type safety. Scoped to this one file rather than disabling
# duplication detection for the project.
sonar.cpd.exclusions=apps/web/src/data/about-sources.ts
