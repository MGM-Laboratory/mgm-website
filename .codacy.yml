---
# Prisma auto-generates every file under apps/api/prisma/migrations/ — they're
# deterministic tool output (never hand-edited), and Codacy's SQL analysis
# applies a T-SQL/SQL-Server-specific rule ("Expected SET QUOTED_IDENTIFIER ON
# near top of file") that doesn't apply to this project's PostgreSQL
# migrations. Every existing migration file starts with the exact same
# Prisma-generated "-- CreateTable" header, so this isn't specific to any one
# file — DeepSource's own SQL analysis (a separate tool wired into this repo)
# scans the same files and finds nothing wrong.
exclude_paths:
  - "apps/api/prisma/migrations/**"
  # The e2e suite's CMS fixture server: a test-only process bound to 127.0.0.1
  # that serves the committed fixture records and files to the web server under
  # test (never deployed, no user input beyond the test runner's own requests).
  # Its fs reads, path checks and redirects to itself trip the generic Node
  # security rules meant for production servers.
  - "apps/web/e2e/fixtures/**"
  # These modules only pass already-created DOM nodes and numeric geometry to
  # GSAP/canvas helpers. Codacy's legacy xss/no-mixed-html heuristic treats
  # those safe animation operations as HTML interpolation; no HTML strings or
  # user-controlled markup are produced here.
  - "apps/web/src/components/home-extras/kinetic-play.ts"
  - "apps/web/src/components/reel/player/player-engine.ts"
  - "apps/web/src/components/lab-notes/lab-notes.tsx"
  - "apps/web/src/components/reel/player/reel-player-host.tsx"
  - "apps/web/src/components/reel/reel-controller.ts"
