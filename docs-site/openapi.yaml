      properties:
        key:
          type: string
          description: The storage key of the new video, in the form `home-video-<uuid>.mp4` or `.webm`.
        size:
          type: integer
          description: The size of the stored file in bytes.
    ContactMailProviderId:
      type: string
      enum:
        - resend
        - smtp
        - ses
    ContactMailStrategy:
      type: string
      enum:
        - resend
        - smtp
        - ses
        - failover
        - loadBalanceEqual
        - loadBalanceWeighted
        - loadBalanceLimit
      description: The single provider values force that provider. The other values choose among the configured providers, and the next candidate takes over when one fails.
    ContactMailLongPeriod:
      type: string
      enum:
        - monthly
        - 30day
      description: The value `monthly` resets on the first day of the calendar month. The value `30day` resets every 30 days.
    ContactMailProviderLimit:
      type: object
      properties:
        windowMode:
          type: string
          enum:
            - calendar
            - rolling
          default: calendar
          description: A `calendar` limit uses a stored counter that an admin can edit. A `rolling` limit counts the sends of this API in the trailing window.
        dailyLimit:
          type: integer
          minimum: 1
        dailyRemaining:
          type: integer
          minimum: 0
        longPeriod:
          $ref: "#/components/schemas/ContactMailLongPeriod"
        longLimit:
          type: integer
          minimum: 1
        longRemaining:
          type: integer
          minimum: 0
    ContactMailProviderWeights:
      type: object
      description: The weight of each provider for the weighted strategy. A missing provider counts as 1.
      properties:
        resend:
          type: number
          exclusiveMinimum: true
          minimum: 0
        smtp:
          type: number
          exclusiveMinimum: true
          minimum: 0
        ses:
          type: number
          exclusiveMinimum: true
          minimum: 0
    ContactMailProviderLimits:
      type: object
      description: The send limit of each provider. A missing provider has no limit.
      properties:
        resend:
          $ref: "#/components/schemas/ContactMailProviderLimit"
        smtp:
          $ref: "#/components/schemas/ContactMailProviderLimit"
        ses:
          $ref: "#/components/schemas/ContactMailProviderLimit"
    ContactDetails:
      type: object
      description: The public contact details. Every field is optional, and a field that is not listed here is refused.
      additionalProperties: false
      properties:
        emails:
          type: array
          minItems: 1
          description: The addresses that receive the messages of the contact form.
          items:
            type: string
            format: email
        address:
          type: string
          minLength: 1
          description: The address, trimmed before it is checked. Line breaks are allowed.
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    ContactSettings:
      type: object
      required:
        - emails
        - address
        - lat
        - lng
      properties:
        emails:
          type: array
          minItems: 1
          description: The addresses that receive the messages of the contact form.
          items:
            type: string
            format: email
        address:
          type: string
          minLength: 1
          description: The address, trimmed before it is checked. Line breaks are allowed.
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        mailStrategy:
          $ref: "#/components/schemas/ContactMailStrategy"
        mailProviderOrder:
          type: array
          description: The order in which providers are tried. The default is resend, smtp, ses.
          items:
            $ref: "#/components/schemas/ContactMailProviderId"
        mailProviderWeights:
          $ref: "#/components/schemas/ContactMailProviderWeights"
        mailProviderLimits:
          $ref: "#/components/schemas/ContactMailProviderLimits"
    ContactSettingsResult:
      type: object
      required:
        - record
      properties:
        record:
          $ref: "#/components/schemas/ContactSettings"
    ContactMailProviderState:
      type: object
