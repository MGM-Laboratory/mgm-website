        name:
          type: string
        type:
          type: string
        size:
          type: integer
    FormVisit:
      type: object
      required:
        - id
        - sessionId
        - type
        - fieldId
        - ip
        - country
        - region
        - city
        - device
        - browser
        - os
        - referer
        - createdAt
      properties:
        id:
          type: string
        sessionId:
          type: string
        type:
          type: string
          enum:
            - view
            - start
            - progress
            - submit
        fieldId:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        device:
          type: string
          nullable: true
        browser:
          type: string
          nullable: true
        os:
          type: string
          nullable: true
        referer:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    FormAnalytics:
      type: object
      required:
        - range
        - totals
        - series
        - heatmap
        - funnel
        - countries
        - cities
        - referrers
        - devices
        - browsers
        - oss
        - languages
        - utmSources
        - points
      properties:
        range:
          type: string
          enum:
            - 24h
            - 7d
            - 30d
            - 90d
            - 365d
            - all
        totals:
          type: object
          required:
            - views
            - uniqueVisitors
            - starts
            - submissions
            - conversion
            - completion
            - medianDurationMs
            - averageDurationMs
          properties:
            views:
              type: integer
            uniqueVisitors:
              type: integer
            starts:
              type: integer
            submissions:
              type: integer
            conversion:
              type: number
              minimum: 0
              maximum: 1
              description: Submissions divided by views.
            completion:
              type: number
              minimum: 0
              maximum: 1
              description: Submissions divided by starts.
            medianDurationMs:
              type: integer
              nullable: true
            averageDurationMs:
              type: integer
              nullable: true
        series:
          type: array
          description: One point for each hour (range `24h`) or day, with zeros where nothing happened.
          items:
            type: object
            required:
              - bucket
              - views
              - starts
              - submissions
            properties:
              bucket:
                type: string
                format: date-time
                description: The start of the bucket.
              views:
                type: integer
              starts:
                type: integer
              submissions:
                type: integer
        heatmap:
          type: array
          description: Views by weekday and hour in the local time given by `tzOffset`.
          items:
            type: object
            required:
              - weekday
              - hour
              - count
            properties:
              weekday:
                type: integer
                minimum: 0
                maximum: 6
                description: 0 is Sunday.
              hour:
                type: integer
                minimum: 0
                maximum: 23
              count:
                type: integer
        funnel:
          type: array
          description: How many sessions answered each question, in the order of the form.
          items:
            type: object
            required:
              - fieldId
              - sessions
            properties:
              fieldId:
                type: string
              sessions:
                type: integer
        countries:
          type: array
          items:
            type: object
            required:
              - country
              - count
            properties:
              country:
                type: string
              count:
                type: integer
        cities:
          type: array
          items:
            type: object
            required:
              - city
              - country
              - count
            properties:
              city:
                type: string
              country:
                type: string
                nullable: true
              count:
                type: integer
        referrers:
          type: array
          description: Views by referrer host. The host is `direct` when there is no referrer.
          items:
            type: object
            required:
              - host
              - count
            properties:
              host:
                type: string
              count:
                type: integer
        devices:
          type: array
          items:
            type: object
            required:
              - device
              - count
            properties:
              device:
                type: string
              count:
                type: integer
        browsers:
          type: array
          items:
            type: object
            required:
              - browser
              - count
            properties:
              browser:
                type: string
              count:
                type: integer
        oss:
          type: array
          items:
            type: object
            required:
              - os
              - count
            properties:
              os:
                type: string
              count:
                type: integer
        languages:
          type: array
          items:
            type: object
            required:
              - language
              - count
            properties:
              language:
                type: string
              count:
                type: integer
        utmSources:
          type: array
          description: Responses by the `utm` source.
          items:
            type: object
            required:
              - source
              - count
            properties:
              source:
                type: string
              count:
                type: integer
        points:
          type: array
          maxItems: 2000
          description: Places of views and responses, rounded to one decimal degree, the largest groups first.
          items:
            type: object
            required:
              - latitude
              - longitude
              - count
              - kind
            properties:
              latitude:
                type: number
              longitude:
                type: number
              count:
                type: integer
              kind:
                type: string
                enum:
                  - view
                  - submit
    FormTheme:
      type: string
      enum:
        - graphite
        - grove
        - ember
        - nebula
        - sky
        - lavender
        - blush
        - signal
        - violet
        - iris
