      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        active:
          type: boolean
        passphrase:
          type: string
          minLength: 8
          maxLength: 200
          description: A new passphrase of 8 to 200 characters, or the value `generate`.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Null removes the expiry.
        permissions:
          $ref: "#/components/schemas/AdminPermissionsInput"
