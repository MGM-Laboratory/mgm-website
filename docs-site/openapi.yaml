      summary: Archive, mark or delete several registrations
      description: Applies one action to up to 200 registrations. An id that matches no registration is skipped without an error. The action `delete` removes the records for good.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRegistrationBulkInput"
