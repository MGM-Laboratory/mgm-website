  /api/cms/projects/{slug}:
    get:
      tags:
        - Projects
      operationId: getProject
      summary: Get one published project
      description: Returns one project with its full body. The record also carries `mediaSizes`, the pixel size of images that the record does not describe. The server measures at most 48 images and waits at most 2.5 seconds for sizes that are not cached yet. A draft answers `404`, the same as a missing record.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The slug of the project. Reserved words in this position are `admin`, `feed`, `bootstrap`, `contributor-photo`, `media` and `video`.
          schema:
            type: string
            example: sample-lab-app
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags:
        - Projects
      operationId: saveProject
      summary: Create, update or rename a project
      description: Saves the record under the slug in the path. When `project.slug` differs from the path slug, the record is renamed. A save of a slug that does not exist creates the record, unless the request names a version or renames. Stored files that the new record no longer references are deleted. The answer is the saved record itself and not a wrapper.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The slug of the project. Reserved words in this position are `admin`, `feed`, `bootstrap`, `contributor-photo`, `media` and `video`.
          schema:
            type: string
            example: sample-lab-app
        - $ref: "#/components/parameters/ExpectedUpdatedAt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectSaveInput"
            example:
              project:
                slug: sample-lab-app
                title: Sample lab app
                summary: A small app that tracks lab equipment.
                categories:
                  - mobile
                techStack:
                  - Kotlin
                status: in-progress
                startDate: "2026-01-15"
                featured: false
                draft: true
                galleryKeys: []
                videoMode: none
                links: []
                contributors: []
                organizations: []
                outputs: []
              body: []
      responses:
        "200":
          description: The saved record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRecord"
        "400":
          description: The body failed validation, or the version header is not an ISO instant. The message names the first failing field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The request renames a record that does not exist under the path slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The new slug is already in use, or the record changed after the editor loaded it, or the record named by the version header is gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
        - Projects
      operationId: deleteProject
      summary: Delete a project
      description: Deletes the record and the stored images, videos and portraits that it referenced.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The slug of the project. Reserved words in this position are `admin`, `feed`, `bootstrap`, `contributor-photo`, `media` and `video`.
          schema:
            type: string
            example: sample-lab-app
      responses:
        "200":
          description: The project was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
