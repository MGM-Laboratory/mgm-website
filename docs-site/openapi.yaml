    AdminRecord:
      type: object
      description: An admin account without its passphrase.
      required:
        - slug
        - name
        - role
        - active
        - expiresAt
        - sessionVersion
        - permissions
        - lastLoginAt
        - createdAt
        - updatedAt
      properties:
        slug:
          type: string
          description: The id of the account, in the form `admin-<uuid>`.
        name:
          type: string
        role:
          type: string
          enum:
            - admin
        active:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: The time after which the account no longer signs in. Null means no expiry.
        sessionVersion:
          type: integer
          description: Starts at 1 and rises by one with every change of the account.
        permissions:
          $ref: "#/components/schemas/AdminPermissions"
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminList:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/AdminRecord"
    AdminRecordResult:
      type: object
      required:
        - record
      properties:
        record:
          $ref: "#/components/schemas/AdminRecord"
    AdminSaveResult:
      type: object
      required:
        - record
      properties:
        record:
          $ref: "#/components/schemas/AdminRecord"
        generatedPassphrase:
          type: string
          description: Present only when the server made a passphrase in this request. It is shown once and cannot be read again.
    AdminCreateInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The name is trimmed before it is checked.
        passphrase:
          type: string
          minLength: 8
          maxLength: 200
          description: A passphrase of 8 to 200 characters, or the value `generate`. When it is left out the server generates one.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        permissions:
          $ref: "#/components/schemas/AdminPermissionsInput"
    AdminUpdateInput:
      type: object
