        in: path
        required: true
        description: The URL name of the event. The key of the image starts with it.
        schema:
          type: string
    post:
      tags:
        - Events
      operationId: uploadEventMedia
      summary: Upload an event image
      description: Stores one PNG, JPEG or WebP image of at most 6 MB and returns its key. The image goes in the JSON body as a base64 data URL. The route answers `400` when the image type or size is wrong or when media storage is not configured.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
