      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          video/webm:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The video was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectVideoResult"
        "400":
          description: The slug is not valid, the content type is not MP4 or WebM, the body is empty, the file is over the limit, the file is not a valid video, or video storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
