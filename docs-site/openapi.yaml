        required: true
        description: The id of the registration, which starts with `reg-`.
        schema:
          type: string
    put:
      tags:
        - Events
      operationId: updateEventRegistrationState
      summary: Change the read or archive state of a registration
      description: Merges the fields of the body into the registration. Setting `read` to true also stamps `readAt` with the current time, and setting it to false clears `readAt`. The body needs at least one of `read` and `status`.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRegistrationStateInput"
            example:
              read: true
      responses:
        "200":
          description: The registration after the change. This body has no `createdAt`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRegistrationStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/events/resolve-maps-link:
    post:
      tags:
        - Events
      operationId: resolveEventMapsLink
      summary: Read the coordinates from a Google Maps link
      description: Looks for coordinates in the link, in the forms `@lat,lng` and `!3d<lat>!4d<lng>`. For a shortened share link on goo.gl or maps.app.goo.gl, the server follows up to 5 redirects with a 4 second timeout for each and looks again. Answers `400` when it finds no coordinates.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
