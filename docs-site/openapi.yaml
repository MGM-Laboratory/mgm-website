      tags:
        - Members
      operationId: saveMember
      summary: Create, update or rename a member profile
      description: Saves the record under the slug in the path. When `member.slug` differs from the path slug, the record is renamed. When the path slug does not exist, the server looks for the record to rename by `sourceSlug`. Failing that, it looks for exactly one other record with the same name, ignoring case. When none is found, it creates the record. The answer is the saved record itself and not a wrapper.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The slug of the member profile.
          schema:
            type: string
            example: ayu
        - $ref: "#/components/parameters/ExpectedUpdatedAt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberSaveInput"
            example:
              member:
                slug: ayu
                name: Ayu
                nickname: Ayu
                role: Research assistant
                division: Software
                group: Residence
                accent: blue
                bio: Works on lab tooling.
                hasPortrait: false
                highlighted: false
                labFocus:
                  - tooling
              profile:
                links:
                  - label: Website
                    url: https://example.org/ayu
      responses:
        "200":
          description: The saved record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRecord"
        "400":
          description: The body failed validation, for example a profile link with an unsafe scheme or a profile over 200000 characters as JSON, or the version header is not an ISO instant. The message names the first failing field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The request renames a record that does not exist under the path slug and `sourceSlug`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The new slug is already in use, or more than one record has the same name and the rename cannot be resolved, or the record changed after the editor loaded it, or the record named by the version header is gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
        - Members
      operationId: deleteMember
      summary: Delete a member profile
      description: Deletes the record. The stored portrait files are not deleted.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The slug of the member profile.
          schema:
            type: string
            example: ayu
      responses:
        "200":
          description: The member was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/members/{slug}/photo:
    post:
      tags:
        - Members
      operationId: uploadMemberPhoto
      summary: Upload a member portrait
      description: Takes a PNG, JPEG or WebP image as a base64 data URL and stores it unchanged. The decoded image must be under 6 MB. The key is built from the slug with every character other than letters, digits, underscores and hyphens replaced by a hyphen.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The slug of the member profile.
          schema:
            type: string
            example: ayu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberImageUpload"
      responses:
        "201":
          description: The portrait was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPhotoResult"
        "400":
          description: The image is empty, over 6 MB, or not a PNG, JPEG or WebP data URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/shortlinks/hosts:
    get:
      tags:
        - Short links
      operationId: listShortLinkHosts
      summary: List the custom domains that the web proxy routes
      description: Returns every custom short domain with its connection status. The primary domain of the site is not in the list.
      security: []
      responses:
        "200":
          description: The custom domains.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkHostList"
              example:
                hosts:
                  - hostname: go.example.org
                    status: connected
  /api/shortlinks/resolve:
    get:
      tags:
        - Short links
      operationId: resolveShortLink
      summary: Resolve a short link and count the click
      description: Looks up the link for a host and a slug. A link that is open and has no passphrase counts one click and answers with the target URL. The route always answers `200`, and the `status` field says what happened. One visitor may call it 300 times a minute.
      security: []
      parameters:
        - name: slug
          in: query
          required: false
          description: The short code of the link. A missing value is read as an empty string, and the answer is still `200` with a status.
          schema:
            type: string
          example: launch
        - name: host
          in: query
          required: false
          description: The host name that the visitor used. A host that is not a short domain falls back to the primary domain of the site. A missing value is read as an empty string.
          schema:
            type: string
          example: go.example.org
      responses:
        "200":
          description: The state of the link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkResolution"
              example:
                status: ok
                longUrl: https://example.org/launch
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/shortlinks/public/{slug}:
    get:
      tags:
        - Short links
      operationId: getShortLinkPublicState
      summary: Read the state of a link for the gate page
      description: Records a view and answers with the state that the gate page must show. A link that has a passphrase, has expired or was used up counts a view and no click. A link that is open and has no passphrase behaves like the resolve route. One visitor may call it 300 times a minute.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The short code of the link.
          schema:
            type: string
        - name: host
          in: query
          required: false
          description: The host name that the visitor used. A missing value is read as an empty string, and the answer is still `200` with a status.
          schema:
            type: string
          example: go.example.org
      responses:
        "200":
          description: The state of the link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkResolution"
              example:
                status: passphrase
                host: go.example.org
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/shortlinks/verify:
    post:
      tags:
        - Short links
      operationId: verifyShortLinkPassphrase
      summary: Check a passphrase and get the target URL
      description: Checks the passphrase of a protected link. A right passphrase counts one click and returns the target URL. A wrong passphrase is recorded as a failed attempt. One visitor may call this route 10 times a minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortLinkVerifyInput"
            example:
              slug: launch
              host: go.example.org
              passphrase: open-sesame
      responses:
        "201":
          description: The passphrase is right, or the link has no passphrase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkVerifyResult"
              example:
                longUrl: https://example.org/launch
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The passphrase is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: The link has expired or its single click was used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/shortlinks/admin/domains:
    get:
      tags:
        - Short links
      operationId: listShortLinkDomains
      summary: List the short domains
      description: Returns every short domain, the primary domain first. A custom domain carries the DNS records that its owner must create. The field `cnameTarget` is null when the API has no routing target set.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: The domains and the routing target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkDomainList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Short links
      operationId: createShortLinkDomain
      summary: Add a custom short domain
      description: Adds a domain in the pending state and creates its verification token. The API detects whether the DNS zone is hosted on Cloudflare. The domain becomes connected after the status route finds the DNS records and the routing.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortLinkDomainInput"
            example:
              hostname: go.example.org
      responses:
        "201":
          description: The domain was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkDomainCreated"
        "400":
          description: The value is not a domain name, or it is the own domain of the site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/shortlinks/admin/domains/{id}:
    get:
      tags:
        - Short links
      operationId: getShortLinkDomainStatus
      summary: Check a custom domain again
      description: Looks up the verification TXT record and asks the domain for the marker page of the site. The domain is connected only when both checks pass. The route saves the new status and provider before it answers. The primary domain answers `404`.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the domain.
          schema:
            type: string
      responses:
        "200":
          description: The domain with the result of each check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkDomainStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
        - Short links
      operationId: deleteShortLinkDomain
      summary: Delete a custom domain
      description: Deletes a domain that has no links. The primary domain cannot be deleted. A domain that still has links answers `409` with the number of links.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the domain.
          schema:
            type: string
      responses:
        "200":
          description: The domain was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkOk"
        "400":
          description: The domain is the primary domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/shortlinks/admin/domains/{id}/connect:
    post:
      tags:
        - Short links
      operationId: connectShortLinkDomain
      summary: Build the one-click Cloudflare setup URL
      description: Builds a signed Domain Connect URL that opens the consent page of Cloudflare. The API never sees a Cloudflare token. When the API has no signing key, `url` is null and the records are still returned so that the admin can enter them by hand. The route answers `409` when the API has no routing target set.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the domain.
          schema:
            type: string
      responses:
        "201":
          description: The setup URL and the DNS records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkConnect"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/shortlinks/admin/links:
    get:
      tags:
        - Short links
      operationId: listShortLinks
      summary: List short links
      description: Returns up to 200 links, newest first. The search matches the slug and the target URL without regard to case. The listing starts a background check of up to 12 targets whose stored check is older than 10 minutes.
      security:
        - adminPassphrase: []
      parameters:
        - name: search
          in: query
          required: false
          description: Text to find in the slug or the target URL. The API cuts it to 200 characters.
          schema:
            type: string
        - name: domainId
          in: query
          required: false
          description: Only list the links of this domain.
          schema:
            type: string
      responses:
        "200":
          description: The links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Short links
      operationId: createShortLink
      summary: Create a short link
      description: Creates a link on a domain. The API makes a random code of 4 to 10 characters when the request has no slug. The response comes before the background check of the target URL finishes.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortLinkCreateInput"
            example:
              domainId: clx0example0domain0id
              longUrl: https://example.org/launch
              slug: launch
              expiresIn: 7d
      responses:
        "201":
          description: The link was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkEnvelope"
        "400":
          description: The body failed validation, or the domain does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The slug is already taken on this domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/shortlinks/admin/links/{id}:
    put:
      tags:
        - Short links
      operationId: updateShortLink
      summary: Update a short link
      description: Changes the target, the slug, the domain, the expiry or the passphrase of a link. A field that the body leaves out keeps its value. A new `expiresIn` counts from the time of the request. A new target URL clears the stored result of the URL check.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the link.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortLinkUpdateInput"
            example:
              longUrl: https://example.org/launch-2
              passphraseAction: keep
      responses:
        "200":
          description: The link after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkEnvelope"
        "400":
          description: The body failed validation, or the domain does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The slug is already taken on the target domain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
        - Short links
      operationId: deleteShortLink
      summary: Delete a short link
      description: Deletes the link and its visits. The route answers `200` also when no link has this id.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the link.
          schema:
            type: string
      responses:
        "200":
          description: The link is gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/shortlinks/admin/links/{id}/analytics:
    get:
      tags:
        - Short links
      operationId: getShortLinkAnalytics
      summary: Read the analytics of a link
      description: Returns the totals, the last 14 days, the top values of each dimension and the 50 latest visits. The visits carry the visitor address and the user agent.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the link.
          schema:
            type: string
      responses:
        "200":
          description: The analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortLinkAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/jobs:
    get:
      tags:
        - Jobs
      operationId: listJobs
      summary: List the open roles
      description: Returns the roles that are published and whose deadline has not passed. The deadline day counts as open. Every record has an empty `content` list, so the listing stays small. The API caches the list for 10 minutes and clears the cache on every save and delete.
      security: []
      responses:
        "200":
          description: The open roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/jobs/admin:
    get:
      tags:
        - Jobs
      operationId: listJobsAdmin
      summary: List every role with its document
      description: Returns all roles, drafts and closed roles included, with their full documents. The newest change comes first.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: Every role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/jobs/applications:
    get:
      tags:
        - Jobs
      operationId: listJobApplications
      summary: List the applications
      description: Returns every application, newest first. The list is not cached.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: The applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplicationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/jobs/applications/bulk:
    post:
      tags:
        - Jobs
      operationId: bulkUpdateJobApplications
      summary: Change many applications at once
      description: Applies one action to up to 200 applications. An id that matches no application is skipped. The action `delete` also removes the stored CV files.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobApplicationBulkInput"
            example:
              ids:
                - app-3f1c2b8e-0000-4000-8000-000000000001
              action: archive
      responses:
        "201":
          description: The action was applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/jobs/applications/{slug}:
    get:
      tags:
        - Jobs
      operationId: getJobApplication
      summary: Read one application
      description: Returns the application and a signed download URL for the CV. The URL works for 15 minutes. The field `cvUrl` is null when the application has no CV or the storage cannot sign the URL.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The id of the application. It starts with `app-`.
          schema:
            type: string
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplicationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/jobs/applications/{slug}/state:
    put:
      tags:
        - Jobs
      operationId: updateJobApplicationState
      summary: Mark an application read or archive it
      description: Merges the read flag or the status into the application. The body needs at least one of the two fields. Setting `read` to true stores the time in `readAt`, and setting it to false clears `readAt`.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The id of the application.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobApplicationStateInput"
            example:
              read: true
      responses:
        "200":
          description: The application after the change. This answer has no `createdAt` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobApplicationEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/jobs/media/{key}:
    get:
      tags:
        - Jobs
      operationId: getJobMedia
      summary: Redirect to an image of a role
      description: Answers with a redirect to a signed download URL that works for 15 minutes. The key must come from the media upload route.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: The key that the upload route returned.
          schema:
            type: string
            pattern: ^job-[a-z0-9]+(?:-[a-z0-9]+)*-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(?:png|jpe?g|webp)$
      responses:
        "302":
          description: The signed URL is in the `Location` header.
          headers:
            Location:
              description: The signed download URL.
              schema:
                type: string
                format: uri
        "400":
          description: The key has the wrong shape, or the media storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/cms/jobs/{slug}:
    get:
      tags:
        - Jobs
      operationId: getJob
      summary: Read one role with its document
      description: Returns the role with its full document. A closed role still resolves, so a direct link can show the closed state. A draft answers `404`.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The URL slug of the role.
          schema:
            type: string
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags:
        - Jobs
      operationId: saveJob
      summary: Create or save a role
      description: Saves the role stored under the slug in the path. The body may carry a new slug, which renames the role. A save for a slug that does not exist yet creates the role. Send the header `x-cms-expected-updated-at` to refuse a save over a newer version. A save that names a version for a role that is gone or renamed answers `409`.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The current slug of the role.
          schema:
            type: string
        - $ref: "#/components/parameters/ExpectedUpdatedAt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
            example:
              job:
                slug: frontend-engineer
                title: Frontend Engineer
                focus: Web interfaces
                commitment: part-time
                mode: hybrid
                deadline: "2026-12-31"
                perks:
                  - Mentoring
                status: published
              content:
                - id: block-1
                  type: paragraph
                  content: []
      responses:
        "200":
          description: The saved role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRecord"
        "400":
          description: The header `x-cms-expected-updated-at` is not an ISO instant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The role changed after the editor loaded it, or the new slug is already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
        - Jobs
      operationId: deleteJob
      summary: Delete a role
      description: Deletes the role. The applications for the role stay in the inbox.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The slug of the role.
          schema:
            type: string
      responses:
        "200":
          description: The role was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/jobs/{slug}/apply:
    post:
      tags:
        - Jobs
      operationId: applyToJob
      summary: Send an application with a CV
      description: Stores the application and the CV, and sends a confirmation mail in the background. The role must be published and its deadline must not have passed. A client may call this route 5 times a minute. The CV must be a PDF or a Word file. The default size limit is 100 MB, and the operator can change it.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The URL slug of the role.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/JobApplyInput"
            encoding:
              cv:
                contentType: application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document
      responses:
        "201":
          description: The application was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobOk"
        "400":
          description: A field failed validation, the role does not exist, the CV is missing or has the wrong type, or the CV storage is not configured. The `message` field names the first problem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The role is not accepting applications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/jobs/{slug}/media:
    post:
      tags:
        - Jobs
      operationId: uploadJobMedia
      summary: Upload an image for a role
      description: Takes one image as a base64 data URL and stores it. The image must be PNG, JPEG or WebP and at most 6 MB after decoding. The response has the key that the media route uses.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The slug of the role. The API puts it in the key.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobMediaInput"
      responses:
        "201":
          description: The image was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobMediaKey"
        "400":
          description: The image has the wrong type, is empty or is too large, or the media storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/contact/attachments:
    post:
      tags:
        - Contact
      operationId: uploadContactAttachment
      summary: Upload a file for the contact form
      description: Takes the raw bytes of one file in the body and stores it. The `x-filename` header gives the original name, which may be percent encoded. The API makes the key from a random id, a cleaned version of the name and the extension. A file of 25 MB or less is accepted. Send the returned key in the field `attachmentKeys` of the contact message.
      security: []
      parameters:
        - name: x-filename
          in: header
          required: false
          description: The original file name, percent encoded.
          schema:
            type: string
          example: brief.pdf
      requestBody:
        required: true
        description: The raw bytes of the file. Any content type is accepted. A type that a browser would run as a page or a script is stored as `application/octet-stream`.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The file was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactAttachment"
              example:
                key: contact-3f1c2b8e-0000-4000-8000-000000000001-brief.pdf
                size: 20480
        "400":
          description: The body is empty, the file is larger than 25 MB, or the attachment storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The body is larger than 26 MB, and the body parser refuses it before the route runs.
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/contact/attachments/{key}:
    get:
      tags:
        - Contact
      operationId: getContactAttachment
      summary: Redirect to an attachment
      description: Answers with a redirect to a signed download URL that works for 15 minutes.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: The key that the upload route returned.
          schema:
            type: string
            pattern: ^contact-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:-[a-z0-9-]{1,60})?(?:\.[a-z0-9]{1,10})?$
      responses:
        "302":
          description: The signed URL is in the `Location` header.
          headers:
            Location:
              description: The signed download URL.
              schema:
                type: string
                format: uri
        "400":
          description: The key has the wrong shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/contact:
    post:
      tags:
        - Contact
      operationId: submitContactMessage
      summary: Send a contact message
      description: Stores the message in the inbox of the admin workspace, queues a notification mail to the configured recipients and sends a confirmation mail to the sender. The mail is sent in the background, so a mail failure never fails the request. One client may call this route 5 times a minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMessageInput"
            example:
              name: Ayu
              email: ayu@example.org
              company: Example Org
              message: We would like to talk about a joint project.
              attachmentKeys: []
      responses:
        "201":
          description: The message was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactOk"
        "400":
          description: A field failed validation. The `errors` object lists the messages for each field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactValidationError"
              example:
                message: Validation failed
                errors:
                  email:
                    - Enter a valid email address.
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    adminPassphrase:
      type: apiKey
      in: header
      name: x-cms-passphrase
      description: The shared admin passphrase. The web app sets it on the server side for the admin routes.
  parameters:
    ExpectedUpdatedAt:
      name: x-cms-expected-updated-at
      in: header
      required: false
      description: The `updatedAt` value of the record as the editor loaded it. When the stored record changed since then, the save answers `409`.
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: The body, the query or a path value failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The admin passphrase is missing or wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No record matches the path.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The record changed after the editor loaded it, or the value already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The request body or the uploaded file is larger than the limit of the route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: The client went over the rate limit.
      headers:
        Retry-After:
          description: Seconds to wait before the next request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      description: The default error body of the API.
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
        message:
          description: One message, or a list of messages when several fields failed.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
    Health:
      type: object
      required:
        - status
        - uptime
        - timestamp
      properties:
        status:
          type: string
          enum:
            - ok
            - error
        uptime:
          type: number
          description: Seconds since the API process started.
        timestamp:
          type: string
          format: date-time
    FormStatus:
      type: string
      enum:
        - draft
        - published
        - closed
    FormOk:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    FormCountResult:
      type: object
      required:
        - ok
        - count
      properties:
        ok:
          type: boolean
          enum:
            - true
        count:
          type: integer
          description: The number of responses that changed.
    FormEnvelope:
      type: object
      required:
        - form
      properties:
        form:
          $ref: "#/components/schemas/FormRecord"
    FormAnswerErrors:
      type: object
      description: The body of a `400` that names the questions whose answers failed.
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: Some answers need another look.
        errors:
          type: object
          description: A map from question id to its error.
          additionalProperties:
            $ref: "#/components/schemas/FormFieldError"
          example:
            q_email:
              code: email
    FormFieldError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - required
            - invalid
            - email
            - url
            - phone
            - number
            - min
            - max
            - minLength
            - maxLength
            - pattern
            - minSelections
            - maxSelections
            - unknownOption
            - date
            - minDate
            - maxDate
            - files
            - tooManyFiles
            - consent
            - color
            - decimals
            - step
        min:
          oneOf:
            - type: number
            - type: string
        max:
          oneOf:
            - type: number
            - type: string
    FormSlugCheck:
      type: object
      required:
        - available
        - suggestion
      properties:
        available:
          type: boolean
          description: True when the given slug is valid and free.
        suggestion:
          type: string
          description: A slug that can be used.
          example: open-day-signup
    FormUnlockInput:
      type: object
      required:
        - passphrase
      properties:
        passphrase:
          type: string
          minLength: 1
          maxLength: 200
    FormClientContext:
      type: object
      description: Details that the form page collects. They are stored for analytics and never used for access control.
      properties:
        language:
          type: string
          maxLength: 35
        timezone:
          type: string
          maxLength: 64
        screen:
          type: string
          maxLength: 20
        utm:
          type: object
          properties:
            source:
              type: string
              maxLength: 200
            medium:
              type: string
              maxLength: 200
            campaign:
              type: string
              maxLength: 200
            term:
              type: string
              maxLength: 200
            content:
              type: string
              maxLength: 200
        referrer:
          type: string
          maxLength: 2000
          description: The `document.referrer` of the form page.
    FormEventInput:
      type: object
      required:
        - sessionId
        - type
      properties:
        sessionId:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,100}$
        type:
          type: string
          enum:
            - view
            - start
            - progress
        fieldId:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          description: The question just answered. It is required when `type` is `progress`.
        context:
          $ref: "#/components/schemas/FormClientContext"
        token:
          type: string
          maxLength: 200
          description: An unlock token. The `x-form-token` header wins when both are sent.
    FormUploadResult:
      type: object
      required:
        - file
      properties:
        file:
          type: object
          required:
            - key
            - name
            - size
            - type
          properties:
            key:
              type: string
              description: The storage key. Use it in the file answer.
            name:
              type: string
            size:
              type: integer
              description: The size in bytes.
            type:
              type: string
              description: The content type that the server stored.
    FormFileAnswer:
      type: object
      required:
        - key
        - name
        - size
        - type
      properties:
        key:
          type: string
          description: The storage key from the upload route.
        name:
          type: string
        size:
          type: integer
        type:
          type: string
        width:
          type: integer
        height:
          type: integer
    FormAnswerValue:
      description: One answer. Text, date, time, country and color questions use a string. Number, rating, scale, NPS and slider questions use a number. Yes or no and consent use a boolean. Choice and ranking questions use option ids. A matrix uses an object from row id to column id or column ids. A name uses `first` and `last`. An address uses `line1`, `line2`, `city`, `region`, `postal` and `country`. File questions use a list of file answers.
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            type: string
        - type: array
          items:
            $ref: "#/components/schemas/FormFileAnswer"
        - type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
    FormAnswers:
      type: object
      description: A map from question id to answer. The text typed beside an "Other" option is stored under the question id followed by `:other`.
      additionalProperties:
        $ref: "#/components/schemas/FormAnswerValue"
    FormSubmissionInput:
      type: object
      required:
        - sessionId
        - answers
      properties:
        sessionId:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,100}$
        answers:
          type: object
          description: A map from question id to answer, at most 1000 entries. Each answer is checked against its question.
          additionalProperties: true
        startedAt:
          type: string
          maxLength: 40
          description: When the respondent pressed Start, as an ISO time.
        context:
          $ref: "#/components/schemas/FormClientContext"
        deviceId:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,100}$
          description: A random id that the browser keeps. A form with one response for each device requires it.
        website:
          type: string
          maxLength: 2000
          description: A real person leaves this field empty.
        token:
          type: string
          maxLength: 200
          description: An unlock token. The `x-form-token` header wins when both are sent.
    FormSubmissionResult:
      type: object
      required:
        - ok
        - responseId
        - endingId
        - score
      properties:
        ok:
          type: boolean
          enum:
            - true
        responseId:
          type: string
        endingId:
          type: string
          description: The id of the ending to show. It is an empty string when the form has no ending.
        score:
          type: number
          nullable: true
          description: The quiz score, or null when scoring is off.
    FormPublicPayload:
      description: What the public read and unlock routes answer. The `state` field tells the shape.
      oneOf:
        - $ref: "#/components/schemas/FormPublicOpen"
        - $ref: "#/components/schemas/FormPublicLocked"
        - $ref: "#/components/schemas/FormPublicUnavailable"
      discriminator:
        propertyName: state
        mapping:
          open: "#/components/schemas/FormPublicOpen"
          locked: "#/components/schemas/FormPublicLocked"
          unavailable: "#/components/schemas/FormPublicUnavailable"
    FormPublicOpen:
      type: object
      required:
        - state
        - slug
        - document
      properties:
        state:
          type: string
          enum:
            - open
        slug:
          type: string
        document:
          $ref: "#/components/schemas/FormPublicDocument"
        token:
          type: string
          description: Present when the visitor unlocked a passphrase form. Send it back on writes.
    FormPublicLocked:
      type: object
      required:
        - state
        - slug
        - title
        - design
        - language
      properties:
        state:
          type: string
          enum:
            - locked
        slug:
          type: string
        title:
          type: string
        design:
          $ref: "#/components/schemas/FormDesign"
        language:
          $ref: "#/components/schemas/FormLanguage"
    FormPublicUnavailable:
      type: object
      required:
        - state
        - slug
        - reason
        - title
        - design
        - language
      properties:
        state:
          type: string
          enum:
            - unavailable
        slug:
          type: string
        reason:
          type: string
          enum:
            - not_open_yet
            - closed
            - limit_reached
        title:
          type: string
        closedTitle:
          type: string
        closedMessage:
          type: string
        opensAt:
          type: string
          description: When the form opens. It is only present when `reason` is `not_open_yet`.
        design:
          $ref: "#/components/schemas/FormDesign"
        language:
          $ref: "#/components/schemas/FormLanguage"
    FormRecord:
      type: object
      required:
        - id
        - slug
        - status
        - document
        - hasPassphrase
        - publishedAt
        - createdAt
        - updatedAt
        - stats
      properties:
        id:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/FormStatus"
        document:
          $ref: "#/components/schemas/FormDocument"
        hasPassphrase:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stats:
          $ref: "#/components/schemas/FormStats"
    FormStats:
      type: object
      required:
        - responses
        - views
        - starts
        - lastResponseAt
      properties:
        responses:
          type: integer
        views:
          type: integer
        starts:
          type: integer
        lastResponseAt:
          type: string
          format: date-time
          nullable: true
    FormSummary:
      type: object
      description: A form without its document. The title, question count and theme come from the document.
      required:
        - id
        - slug
        - status
        - hasPassphrase
        - publishedAt
        - createdAt
        - updatedAt
        - stats
        - title
        - questionCount
        - theme
      properties:
        id:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/FormStatus"
        hasPassphrase:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stats:
          $ref: "#/components/schemas/FormStats"
        title:
          type: string
        questionCount:
          type: integer
          description: The number of questions, not counting content blocks and hidden fields.
        theme:
          $ref: "#/components/schemas/FormTheme"
    FormCreateInput:
      type: object
      required:
        - document
      properties:
        document:
          $ref: "#/components/schemas/FormDocument"
        slug:
          type: string
          maxLength: 200
          description: Lowercase letters, numbers and hyphens, at most 80 characters, with no leading, trailing or doubled hyphen. The words admin, api, media, preview, new and public are reserved. An empty slug gets a random one.
        status:
          $ref: "#/components/schemas/FormStatus"
    FormUpdateInput:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/FormDocument"
        slug:
          type: string
          maxLength: 200
        status:
          $ref: "#/components/schemas/FormStatus"
        passphraseAction:
          type: string
          enum:
            - keep
            - set
            - remove
          default: keep
        passphrase:
          type: string
          maxLength: 200
          description: The new passphrase. It is required when `passphraseAction` is `set`.
    FormMediaImageInput:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          description: A base64 data URL that starts with `data:image/`.
    FormResponseRecord:
      type: object
      required:
        - id
        - formId
        - answers
        - score
        - endingId
        - sessionId
        - spam
        - meta
        - admin
        - createdAt
      properties:
        id:
          type: string
        formId:
          type: string
        answers:
          $ref: "#/components/schemas/FormAnswers"
        score:
          type: number
          nullable: true
        endingId:
          type: string
          nullable: true
        sessionId:
          type: string
          nullable: true
        spam:
          type: boolean
          description: True when the response is marked as spam.
        meta:
          type: object
          required:
            - ip
            - userAgent
            - referer
            - country
            - region
            - city
            - latitude
            - longitude
            - timezone
            - device
            - browser
            - os
            - language
            - screen
            - deviceId
            - utm
            - startedAt
            - durationMs
          properties:
            ip:
              type: string
              nullable: true
              description: Null when the form does not collect the location.
            userAgent:
              type: string
              nullable: true
            referer:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
            region:
              type: string
              nullable: true
            city:
              type: string
              nullable: true
            latitude:
              type: number
              nullable: true
            longitude:
              type: number
              nullable: true
            timezone:
              type: string
              nullable: true
            device:
              type: string
              nullable: true
            browser:
              type: string
              nullable: true
            os:
              type: string
              nullable: true
            language:
              type: string
              nullable: true
            screen:
              type: string
              nullable: true
            deviceId:
              type: string
              nullable: true
            utm:
              type: object
              nullable: true
              additionalProperties:
                type: string
            startedAt:
              type: string
              format: date-time
              nullable: true
            durationMs:
              type: integer
              nullable: true
        admin:
          type: object
          required:
            - starred
            - flagged
            - reviewed
            - tags
            - note
            - editedAt
          properties:
            starred:
              type: boolean
            flagged:
              type: boolean
            reviewed:
              type: boolean
            tags:
              type: array
              items:
                type: string
            note:
              type: string
              nullable: true
            editedAt:
              type: string
              format: date-time
              nullable: true
