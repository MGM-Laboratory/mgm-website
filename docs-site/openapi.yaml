  /api/cms/events/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: The URL name of the event.
        schema:
          type: string
    get:
      tags:
        - Events
      operationId: getEvent
      summary: Get one published event
      description: Returns the event. A draft answers `404` as if it did not exist.
      security: []
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRecordResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags:
        - Events
      operationId: saveEvent
      summary: Create or replace an event
      description: Replaces the whole record. When no event has the path slug and the request has no `x-cms-expected-updated-at` header, the call creates the event. The `slug` in the body is the new URL name, so a different value renames the event. Answers `409` when the new slug belongs to another event, when the stored record changed after the editor loaded it, or when the editor named a version and the record is gone. The answer is the record itself, not wrapped in `record`.
      security:
        - adminPassphrase: []
      parameters:
        - $ref: "#/components/parameters/ExpectedUpdatedAt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
            example:
              slug: open-lab-day
              title: Open lab day
              description: A tour of the lab and its projects.
              startAt: "2026-12-05T02:00:00Z"
              endAt: "2026-12-05T06:00:00Z"
              allDay: false
              timezoneOffset: 7
              location: Main lab
              draft: false
              speakers:
                - name: Ayu
                  institution: Example University
              rundown:
                - time: 09:00
                  item: Welcome
              registrationEnabled: true
              registrationCapacity: 50
              content: []
      responses:
        "200":
          description: The saved event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
        - Events
      operationId: deleteEvent
      summary: Delete an event
      description: Removes the event record. Its registrations and uploaded images stay.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: The event is deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
