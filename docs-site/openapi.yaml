openapi: 3.0.3
info:
  title: MGM Laboratory website API
  version: "1"
  description: |
    REST API of the MGM Laboratory website. The public pages read content from it, and the admin workspace writes content through it.

    Every route starts with `/api`. Admin routes need the header `x-cms-passphrase`. The web app adds that header on the server side, so a browser never sees it.

    A request that goes over a rate limit answers `429` with a `Retry-After` header. A body that fails validation answers `400` on most routes. A few admin routes answer `500` for an invalid body. The page [docs/errors.md](https://github.com/MGM-Laboratory/mgm-website/blob/main/docs/errors.md) of the repository lists them. A record that changed after an editor loaded it answers `409` when the request carries the header `x-cms-expected-updated-at`.

    A body over the size limit of the server answers `413`. The body of that answer is not always JSON, so this document does not repeat the `413` on every route.
  license:
    name: GNU General Public License v3.0
    url: https://github.com/MGM-Laboratory/mgm-website/blob/main/LICENSE
servers:
  - url: https://{host}
    description: A deployment, with the host that its operator gives you
    variables:
      host:
        default: api.example.org
tags:
  - name: Health
    description: Whether the API and its database answer.
  - name: Forms (public)
    description: Routes that people filling in a form use. They read a published form, unlock it with a passphrase, record visits, upload files, send a response and load the design media of a form. Every route here needs no admin passphrase. Unknown slugs and drafts answer 404. Writes have their own per-visitor limit each minute, and the general rate limit applies to the rest.
  - name: Forms admin
    description: Routes of the forms workspace. Every route needs the `x-cms-passphrase` header. Requests with a wrong or missing passphrase answer 401 and count against the general rate limit. Failures that come from the service answer with a body that has `statusCode` and `message`. Failures of the answers of a response also carry an `errors` object.
  - name: Root
    description: The root route of the API.
  - name: Admins
    description: Admin accounts of the workspace and the login check. Only the login check is public. Every other route needs the configured admin passphrase.
  - name: Home content
    description: The video block of the home page.
  - name: Contact settings
    description: The public contact details and the mail routing of the contact form.
  - name: Contact inquiries
    description: The inbox of messages that visitors sent through the contact form.
  - name: Events
    description: Lab events, their calendar files, public registration and the admin registration inbox.
  - name: Research
    description: Research initiatives with their milestones, outputs and cover images.
  - name: Articles
    description: Articles with their BlockNote documents and cover images.
  - name: Projects
    description: Project records with a rich text body, a cover, a gallery, media sections and an optional demo video. The public site reads published records. The admin workspace reads drafts too and saves, deletes and uploads files.
  - name: Publications
    description: Publication records with authors, citation data and an optional PDF paper. The public site reads published records. A paper is served only when its record is published and marks the paper visible.
  - name: Members
    description: Member profiles of the laboratory. Every record is public. The admin workspace saves and deletes records and uploads portraits.
  - name: Short links
    description: Short links on the site domain and on custom domains. The public routes resolve a link and record the visit. The admin routes manage domains, links and analytics.
  - name: Jobs
    description: Open roles, applications and the admin inbox for applications.
  - name: Contact
    description: The public contact form and its file attachments.
paths:
  /api/health:
    get:
      tags:
        - Health
      operationId: getHealth
      summary: Check that the API and its database answer
      description: Runs `SELECT 1` on the database. The web status chip and the container health check call this route.
      security: []
      responses:
        "200":
          description: The API and the database answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database does not answer. The body has the same shape with `status` set to `error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          description: The client went over the rate limit.
          headers:
            Retry-After:
              description: Seconds to wait before the next request.
              schema:
                type: integer
  /api/forms/public/{slug}:
    get:
      operationId: getFormPublic
      tags:
        - Forms (public)
      summary: Read a form as a respondent
      description: Returns the form in one of three states. `open` carries the public document. `locked` means the form needs a passphrase. `unavailable` means the form is closed, not open yet or full. The slug is matched in lowercase.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The public URL slug of the form.
          schema:
            type: string
            example: open-day-signup
        - name: x-form-token
          in: header
          required: false
          description: The unlock token from the unlock route. A passphrase form needs it on every write.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: The state of the form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormPublicPayload"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/forms/public/{slug}/unlock:
    post:
      operationId: unlockFormPublic
      tags:
        - Forms (public)
      summary: Unlock a passphrase form
      description: Checks the passphrase and answers with the same payload as the read route. An unlocked answer carries a `token` that the page sends back in the `x-form-token` header on later calls. The token is valid for 12 hours and stops working when the admin changes or removes the passphrase. A form without a passphrase answers as unlocked and has no token. The limit is 10 requests each minute for each visitor.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The public URL slug of the form.
          schema:
            type: string
            example: open-day-signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormUnlockInput"
            example:
              passphrase: correct horse battery
      responses:
        "200":
          description: The payload of the form. The `token` is present when a passphrase form was unlocked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormPublicPayload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The passphrase is not right.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/public/{slug}/events:
    post:
      operationId: recordFormEvent
      tags:
        - Forms (public)
      summary: Record a visit event
      description: Records that a visitor viewed the form, started it or answered a question. The same session, type and question are stored once. A `progress` event for a question that no longer exists answers `ok` and is not counted. The limit is 120 requests each minute for each visitor.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The public URL slug of the form.
          schema:
            type: string
            example: open-day-signup
        - name: x-form-token
          in: header
          required: false
          description: The unlock token from the unlock route. A passphrase form needs it on every write.
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormEventInput"
            example:
              sessionId: 3f1c2a9e-7b5d-4a0e-9c1d-2f6a8b4e0d11
              type: progress
              fieldId: q_name
      responses:
        "200":
          description: The event was handled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The form is locked and the token is missing or not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/public/{slug}/uploads:
    post:
      operationId: uploadFormFile
      tags:
        - Forms (public)
      summary: Upload a file for a question
      description: The body is the raw file, with any content type. The request must send `Content-Length`. The file size limit is the smaller of the question limit and the server limit, which is 100 MB by default. Picture and signature questions check the bytes and accept PNG, JPEG, WebP and GIF only. Other file questions check the name and the type against the categories that the question accepts. The answer holds a `key` that goes into the answers of the response. Uploads that no response claims are removed after about a day. The limit is 30 requests each minute for each visitor, and the server holds a small number of upload bodies at once.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The public URL slug of the form.
          schema:
            type: string
            example: open-day-signup
        - name: x-form-token
          in: header
          required: false
          description: The unlock token from the unlock route. A passphrase form needs it on every write.
          schema:
            type: string
            maxLength: 200
        - name: fieldId
          in: query
          required: true
          description: The id of the file, image or signature question.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
        - name: sessionId
          in: query
          required: true
          description: The session id of the visitor.
          schema:
            type: string
            pattern: ^[A-Za-z0-9_.:-]{1,100}$
        - name: x-file-name
          in: header
          required: false
          description: The original file name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The file was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The form is locked and the token is missing or not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "411":
          description: The request did not declare its size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: File storage is not available, or the server holds too many uploads at once. The second case sends `Retry-After`.
          headers:
            Retry-After:
              description: Seconds to wait before the next try, sent when the server is busy.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/forms/public/{slug}/responses:
    post:
      operationId: submitFormResponse
      tags:
        - Forms (public)
      summary: Send a response
      description: Checks every answer against its question with the same rules as the form page. Answers to questions that the respondent never met are dropped. File answers must name keys from the upload route. A `400` for answers has an `errors` object that maps question ids to error codes. A real person leaves the `website` field empty. The limit is 10 requests each minute for each visitor.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The public URL slug of the form.
          schema:
            type: string
            example: open-day-signup
        - name: x-form-token
          in: header
          required: false
          description: The unlock token from the unlock route. A passphrase form needs it on every write.
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormSubmissionInput"
            example:
              sessionId: 3f1c2a9e-7b5d-4a0e-9c1d-2f6a8b4e0d11
              startedAt: "2026-01-15T08:30:00.000Z"
              answers:
                q_name:
                  first: Ayu
                  last: Example
                q_email: ayu@example.org
      responses:
        "201":
          description: The response was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSubmissionResult"
        "400":
          description: The body is not valid, some answers failed, or the form allows one response for each device and the body has no `deviceId`. When answers failed, the body has `message` and `errors`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/FormAnswerErrors"
        "401":
          description: The form is locked and the token is missing or not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The form is closed, not open yet or full, this device already responded, or a file was already submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/media/{key}:
    get:
      operationId: getFormMedia
      tags:
        - Forms (public)
      summary: Load a design image or video of a form
      description: Redirects to a signed storage link that is valid for 15 minutes. Only keys that an admin upload made are served, and only while a form uses them.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: The storage key that the media upload returned.
          schema:
            type: string
            pattern: ^form-[a-z0-9]{1,40}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(png|jpg|webp|gif|mp4|webm)$
      responses:
        "302":
          description: A redirect to the signed link.
          headers:
            Location:
              description: The signed storage link.
              schema:
                type: string
                format: uri
        "404":
          $ref: "#/components/responses/NotFound"
  /api/forms/admin:
    get:
      operationId: listFormsAdmin
      tags:
        - Forms admin
      summary: List all forms
      description: Returns every form, the most recently updated first, without the document body.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: The forms.
          content:
            application/json:
              schema:
                type: object
                required:
                  - forms
                properties:
                  forms:
                    type: array
                    items:
                      $ref: "#/components/schemas/FormSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createFormAdmin
      tags:
        - Forms admin
      summary: Create a form
      description: Validates the document and stores it. An empty or missing slug gets a random one. The default status is `draft`. A form that is created as `published` gets its `publishedAt` time now.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormCreateInput"
            example:
              slug: open-day-signup
              status: draft
              document:
                title: Open day sign-up
                fields:
                  - id: q_name
                    type: short_text
                    label: Your name
                    required: true
      responses:
        "201":
          description: The form was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: No free random slug was found. Try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/forms/admin/slug-available:
    get:
      operationId: checkFormSlugAdmin
      tags:
        - Forms admin
      summary: Check whether a form URL is free
      description: Answers whether the slug is valid and unused, and gives a slug that can be used. The suggestion is the slug itself when it is free, else a numbered variant, else a random slug.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: query
          required: false
          description: The slug to check. Only the first 200 characters count.
          schema:
            type: string
        - name: excludeId
          in: query
          required: false
          description: A form id whose own slug counts as free, used while editing that form.
          schema:
            type: string
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSlugCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/admin/{id}:
    get:
      operationId: getFormAdmin
      tags:
        - Forms admin
      summary: Get a form
      description: Returns the form with its full document and its counters.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
      responses:
        "200":
          description: The form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: updateFormAdmin
      tags:
        - Forms admin
      summary: Update a form
      description: Changes only the fields that the body names. A new document replaces the whole stored document. The `passphraseAction` is `keep` by default, `set` needs a `passphrase`, and `remove` clears it. Changing or removing the passphrase ends every unlock token. The first change to `published` sets `publishedAt`.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormUpdateInput"
            example:
              status: published
              passphraseAction: set
              passphrase: correct horse battery
      responses:
        "200":
          description: The updated form.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: deleteFormAdmin
      tags:
        - Forms admin
      summary: Delete a form
      description: Deletes the form with its responses, events and uploads, and removes the stored files. Design media that another form still uses stay in storage.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
      responses:
        "200":
          description: The form was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/admin/{id}/duplicate:
    post:
      operationId: duplicateFormAdmin
      tags:
        - Forms admin
      summary: Duplicate a form
      description: Makes a draft copy with the same document, the title followed by `(copy)`, and a new slug. The copy has no passphrase, no responses and no events. It keeps pointing at the design media of the original.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
      responses:
        "201":
          description: The copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/admin/{id}/media:
    post:
      operationId: uploadFormMediaAdmin
      tags:
        - Forms admin
      summary: Upload a design image
      description: The body is JSON with an `image` that is a base64 data URL. The decoded image must be PNG, JPEG, WebP or GIF by its bytes and at most 6 MB. The answer holds the storage `key` for the `key` field of a media item in the form document.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormMediaImageInput"
            example:
              image: data:image/png;base64,iVBORw0KGgo=
      responses:
        "201":
          description: The image was stored.
          content:
            application/json:
              schema:
                type: object
                required:
                  - key
                properties:
                  key:
                    type: string
                    description: The storage key. Use it with the public media route.
                    example: form-clx1abc2d0000example0form-5b0e8f2a-3c41-4d6e-9a17-8c2f6d1e4b90.png
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Media storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/forms/admin/{id}/responses:
    get:
      operationId: listFormResponsesAdmin
      tags:
        - Forms admin
      summary: List the responses of a form
      description: Returns one page of responses, the newest first. A page holds at most 5000 responses. Pass `nextCursor` as `cursor` to read the next page. A `cursor` or `limit` with a wrong shape is ignored.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
            pattern: ^[a-z0-9]{1,40}$
        - name: limit
          in: query
          required: false
          description: The page size. The value is cut to the range 1 to 5000.
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 5000
      responses:
        "200":
          description: One page of responses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormResponseList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/admin/{id}/responses/bulk:
    post:
      operationId: bulkFormResponsesAdmin
      tags:
        - Forms admin
      summary: Run one action on many responses
      description: Applies one action to the listed responses of the form. Ids that do not belong to the form are skipped, and `count` is the number of responses that changed. The `delete` action also removes the uploaded files of those responses. The `tag` and `untag` actions need a `tag`, which is cut to 40 characters, and a response keeps at most 20 tags.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormBulkInput"
            example:
              ids:
                - clx1resp0000example0001
                - clx1resp0000example0002
              action: tag
              tag: follow-up
      responses:
        "200":
          description: The action ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormCountResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/admin/{id}/responses/apply:
    post:
      operationId: applyFormResponsesAdmin
      tags:
        - Forms admin
      summary: Replace the answers of many responses
      description: Replaces the answers of each listed response, for data cleaning. All updates are checked first and written in one transaction, so one bad update changes nothing. A response can appear once. Answers for unknown questions are dropped, and file answers may only keep files that the response already has.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormApplyInput"
            example:
              updates:
                - id: clx1resp0000example0001
                  answers:
                    q_email: ayu@example.org
      responses:
        "200":
          description: The answers were replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormCountResult"
        "400":
          description: The body is not valid, or an answer is not valid for its question. The second case has an `errors` object.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/FormAnswerErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/admin/{id}/responses/{responseId}:
    patch:
      operationId: patchFormResponseAdmin
      tags:
        - Forms admin
      summary: Change one response
      description: Changes the admin flags, tags and note of a response, or merges new answers into it. A blank answer clears that question. Unknown keys in the body answer 400. Editing answers sets `editedAt`.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
        - name: responseId
          in: path
          required: true
          description: The id of the response.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormResponsePatch"
            example:
              starred: true
              tags:
                - follow-up
              note: Call back on Monday.
      responses:
        "200":
          description: The updated response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - response
                properties:
                  response:
                    $ref: "#/components/schemas/FormResponseRecord"
        "400":
          description: The body is not valid, or an answer is not valid for its question. The second case has an `errors` object.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/FormAnswerErrors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/admin/{id}/files/{key}:
    get:
      operationId: getFormFileAdmin
      tags:
        - Forms admin
      summary: Get an uploaded file of a respondent
      description: Without `download=1` the answer is JSON with a signed link that is valid for 15 minutes. With `download=1` the answer is the file itself as an attachment, so the web app can relay it. The server reads at most the upload limit, which is 100 MB by default.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
        - name: key
          in: path
          required: true
          description: The storage key of the upload, as found in a file answer.
          schema:
            type: string
            pattern: ^formfile-[a-z0-9]{1,40}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.[a-z0-9]{1,10}$
        - name: download
          in: query
          required: false
          description: Send `1` to receive the file bytes. Any other value gives the signed link.
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: The signed link, or the file when `download=1`.
          headers:
            Content-Disposition:
              description: Sent with `download=1`. The file is an attachment.
              schema:
                type: string
            Cache-Control:
              description: Sent with `download=1` as `private, no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormFileLink"
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: The file could not be read from storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: File storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/forms/admin/{id}/analytics:
    get:
      operationId: getFormAnalyticsAdmin
      tags:
        - Forms admin
      summary: Get the traffic analytics of a form
      description: Returns counters, a time series, a weekday and hour heatmap, a drop-off funnel, top lists and map points for the range. Day ranges start at local midnight for the given offset. Spam responses are not counted as submissions. Each query has a 15 second limit.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
        - name: range
          in: query
          required: false
          description: The time range. The known values are `24h`, `7d`, `30d`, `90d`, `365d` and `all`. A missing or unknown value gives `30d`.
          schema:
            type: string
            default: 30d
        - name: tzOffset
          in: query
          required: false
          description: Minutes east of UTC for the local time of the admin. A value outside -840 to 840 is cut to the nearest end, and a missing or invalid value gives 0.
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: The analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormAnalytics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/forms/admin/{id}/visits:
    get:
      operationId: listFormVisitsAdmin
      tags:
        - Forms admin
      summary: List the latest visits of a form
      description: Returns the latest events of the form, the newest first, for the visitor log.
      security:
        - adminPassphrase: []
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the form.
          schema:
            type: string
            example: clx1abc2d0000example0form
        - name: limit
          in: query
          required: false
          description: The number of events. The value is cut to the range 1 to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        "200":
          description: The visits.
          content:
            application/json:
              schema:
                type: object
                required:
                  - visits
                properties:
                  visits:
                    type: array
                    items:
                      $ref: "#/components/schemas/FormVisit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api:
    get:
      tags:
        - Root
      operationId: getRootApi
      summary: Read the root greeting
      description: Answers the fixed text `Hello World!`. It reads no data and needs no authentication.
      security: []
      responses:
        "200":
          description: The greeting.
          content:
            text/html:
              schema:
                type: string
                example: Hello World!
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/admins/verify:
    post:
      tags:
        - Admins
      operationId: verifyAdminAccount
      summary: Check the passphrase of an admin account
      description: The login page calls this route. It checks the passphrase against the active accounts that have not expired and records the login time of the account that matches. This route has its own limit of 10 requests a minute for each visitor, and successful requests count too.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminVerifyInput"
      responses:
        "201":
          description: The passphrase matches an active account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerifyResult"
        "400":
          description: The passphrase is missing, empty or longer than 300 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No active account matches the passphrase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/admins:
    get:
      tags:
        - Admins
      operationId: listAdminAccounts
      summary: List the admin accounts
      description: Returns every account, oldest first. The stored passphrase is never part of a record. The list can be up to 30 seconds old after a change made by another process.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: All admin accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags:
        - Admins
      operationId: createAdminAccount
      summary: Create an admin account
      description: Creates an active account with a slug that the server makes. When the body has no passphrase or the value `generate`, the server makes one and returns it once in `generatedPassphrase`. A passphrase that the caller typed is not returned.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateInput"
            example:
              name: Ayu Example
              passphrase: generate
              expiresAt: "2027-01-31T00:00:00.000Z"
              permissions:
                articles:
                  - write
                contact-inquiries:
                  - read
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSaveResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/admins/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        description: The slug of the admin account, in the form `admin-<uuid>`.
        schema:
          type: string
    get:
      tags:
        - Admins
      operationId: getAdminAccount
      summary: Read one admin account
      description: Reads the account from the database and not from the cache. The stored passphrase is never part of the record.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRecordResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags:
        - Admins
      operationId: updateAdminAccount
      summary: Change an admin account
      description: Changes only the fields in the body. Pages that are missing from `permissions` keep their stored actions. Every successful change raises `sessionVersion` by one. A new passphrase replaces the old one, and the value `generate` makes the server return a new one once in `generatedPassphrase`.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateInput"
            example:
              active: false
      responses:
        "200":
          description: The account was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSaveResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags:
        - Admins
      operationId: deleteAdminAccount
      summary: Delete an admin account
      description: Deletes the account for good.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: The account was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOk"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/home:
    get:
      tags:
        - Home content
      operationId: getHomeContent
      summary: Read the home page content
      description: Public. Returns the saved video block, or the default block when nothing was saved or the stored record is not valid. The answer can be cached for up to 10 minutes.
      security: []
      responses:
        "200":
          description: The home page content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeContentResult"
              example:
                record:
                  videoMode: none
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags:
        - Home content
      operationId: saveHomeContent
      summary: Save the home page content
      description: Replaces the single home record. A `videoMode` other than `upload` is stored as `none`.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeContent"
            example:
              videoMode: upload
              videoKey: home-video-0b2f9a4e-6c1d-4f7a-8e53-2d9c1a7b4e60.mp4
              videoName: lab-profile.mp4
              videoSize: 52428800
      responses:
        "200":
          description: The saved content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeContentResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/home/video:
    post:
      tags:
        - Home content
      operationId: uploadHomeVideo
      summary: Upload the home page video
      description: Takes the video as raw bytes in the body, with the content type `video/mp4` or `video/webm`. The server checks the passphrase before it reads the body. It also checks the file signature and the size, which is 500 MB by default and set by the operator. The route stores the file and returns its key. Save the key with the save route of the home content to use it.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          video/webm:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: The video was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeVideoUploadResult"
        "400":
          description: The content type is not `video/mp4` or `video/webm`, the body is empty, the file is not a valid video or it is over the size limit, or video storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The body is larger than the limit of the route. This answer comes from the body parser, and its body is not always JSON.
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/home/video/{key}:
    get:
      tags:
        - Home content
      operationId: getHomeVideo
      summary: Play the home page video
      description: Public. Redirects to a signed storage address that works for one hour. Only the video that the saved home content names can be played.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: The key that the upload route returned, in the form `home-video-<uuid>.mp4` or `.webm`.
          schema:
            type: string
            pattern: ^home-video-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(mp4|webm)$
      responses:
        "302":
          description: Redirect to the signed address of the video.
          headers:
            Location:
              description: The signed storage address.
              schema:
                type: string
                format: uri
        "400":
          description: The key has the wrong form, it is not the video of the saved home content, or media storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/cms/contact-settings:
    get:
      tags:
        - Contact settings
      operationId: getContactSettings
      summary: Read the contact settings
      description: Returns the saved settings, or the default settings when nothing was saved or the stored record is not valid. The answer can be cached for up to 10 minutes.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: The contact settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSettingsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags:
        - Contact settings
      operationId: saveContactSettings
      summary: Replace the contact settings
      description: Replaces the whole record, including the mail routing. A body that has the old single field `email` and no `emails` is read as a list with that one address. Fields with a default take it when the body leaves them out. This route and the details route never run at the same time on the record.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSettings"
            example:
              emails:
                - contact@example.org
              address: Example Street 1, Example City
              lat: 0.0
              lng: 0.0
              mailStrategy: failover
              mailProviderOrder:
                - resend
                - smtp
                - ses
              mailProviderWeights: {}
              mailProviderLimits: {}
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSettingsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags:
        - Contact settings
      operationId: saveContactDetails
      summary: Change only the contact details
      description: Changes the fields in the body among `emails`, `address`, `lat` and `lng`. The stored mail routing stays as it is. A field that is not one of these four is refused.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactDetails"
            example:
              address: Example Street 1, Example City
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSettingsResult"
        "400":
          description: A value is not valid or the body has an unknown field. The message names the first problem as the field path and the reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/contact-settings/mail-provider-status:
    get:
      tags:
        - Contact settings
      operationId: getMailProviderStatus
      summary: Read the state of the mail providers
      description: Says for each provider whether it is configured and, when the saved settings give it a limit, how many sends remain. It never returns credentials.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: The state of the providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMailProviderStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/contact-inquiries:
    get:
      tags:
        - Contact inquiries
      operationId: listContactInquiries
      summary: List the contact inquiries
      description: Returns every inquiry, newest first, with no paging and no cache.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: All inquiries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactInquiryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/contact-inquiries/{slug}/state:
    put:
      tags:
        - Contact inquiries
      operationId: updateContactInquiryState
      summary: Mark an inquiry read or move it to the archive
      description: Changes the read flag, the status or both. Setting `read` to true stores the current time in `readAt`, and setting it to false clears `readAt`. The message and the sender stay as they are.
      security:
        - adminPassphrase: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The slug of the inquiry.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInquiryStateInput"
            example:
              read: true
              status: archived
      responses:
        "200":
          description: The inquiry after the change. The record has no `createdAt` field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactInquiryStateResult"
        "400":
          description: The body has neither `read` nor `status`, or a value is not valid. The message is the first problem only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/contact-inquiries/bulk:
    post:
      tags:
        - Contact inquiries
      operationId: bulkContactInquiries
      summary: Apply one action to many inquiries
      description: Applies the action to every inquiry whose slug is in the list and skips unknown slugs without an error. The action `delete` removes the inquiries for good. The answer does not say how many inquiries changed.
      security:
        - adminPassphrase: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInquiryBulkInput"
            example:
              ids:
                - inquiry-00000000-0000-4000-8000-000000000001
              action: markRead
      responses:
        "201":
          description: The action ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactInquiryOk"
        "400":
          description: The list is empty or has more than 200 ids, an id is empty, or the action is unknown. The message is the first problem only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/events:
    get:
      tags:
        - Events
      operationId: listEvents
      summary: List the published events
      description: Returns every event that is not a draft, newest saved first. The answer is cached on the server for 10 minutes and the cache clears on every save, delete or bootstrap.
      security: []
      responses:
        "200":
          description: The published events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/events/admin:
    get:
      tags:
        - Events
      operationId: listEventsAdmin
      summary: List all events including drafts
      description: Returns every event, newest saved first. The admin workspace uses it. The answer is cached on the server for 10 minutes.
      security:
        - adminPassphrase: []
      responses:
        "200":
          description: Every event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/events/calendar.ics:
    get:
      tags:
        - Events
      operationId: getEventsCalendarFeed
      summary: Download the iCalendar feed of the published events
      description: Calendar apps poll this URL to subscribe to every published event. The answer is an RFC 5545 document with the header `Cache-Control` set to `public, max-age=900`. The general rate limit does not apply to this route, so calendar apps can poll it.
      security: []
      responses:
        "200":
          description: A VCALENDAR document with one VEVENT for each published event.
          content:
            text/calendar:
              schema:
                type: string
                example: "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MGM Laboratory//MGM Event Calendar//EN\r\nEND:VCALENDAR\r\n"
