        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/cms/events/{slug}/register:
    parameters:
      - name: slug
        in: path
        required: true
        description: The URL name of the event.
        schema:
          type: string
    post:
      tags:
        - Events
      operationId: registerForEvent
      summary: Register a visitor for an event
      description: Stores the registration in the admin inbox and sends a confirmation email in the background. A mail failure does not fail the request. Registration closes when the event ends, and for an all-day event it stays open through the last day. Each visitor can send 5 requests a minute to this route.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRegistrationInput"
            example:
              agreedToTerms: true
              fullName: Ayu
              email: ayu@example.org
              phone: 0812345678
      responses:
        "201":
          description: The registration is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventOk"
        "400":
          description: The body failed validation, or no published event has this slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The event does not accept registrations, or it already ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
