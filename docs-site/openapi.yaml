          items:
            type: string
            minLength: 1
            maxLength: 80
        abstract:
          type: string
          maxLength: 50000
        authors:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/PublicationAuthor"
        draft:
          type: boolean
          description: A draft is hidden from the public routes and its paper is not served.
        paperKey:
          type: string
          minLength: 1
          maxLength: 500
          description: The storage key that the paper upload returned.
        paperName:
          type: string
          maxLength: 300
        paperSize:
          type: integer
          minimum: 0
          maximum: 1073741824
          description: Size of the paper in bytes.
        paperHidden:
          type: boolean
          default: true
          description: A paper is served only when this is false. A save that omits the field sets it to true.
    PublicationAuthor:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
          enum:
            - residence
            - non-residence
          description: A residence author resolves through the member profile. Older records omit it and the presence of `memberSlug` decides.
        name:
          type: string
          minLength: 1
          maxLength: 200
        affiliation:
          type: string
          maxLength: 300
        memberSlug:
          type: string
          minLength: 1
          maxLength: 120
        url:
          type: string
          maxLength: 500
        photoKey:
          type: string
          minLength: 1
          maxLength: 500
          description: The storage key that the author portrait upload returned.
        photoPosition:
          $ref: "#/components/schemas/PublicationPhotoPosition"
    PublicationPhotoPosition:
      type: object
      description: The crop of a portrait. The coordinates are percentages.
      required:
        - x
        - y
        - zoom
      properties:
        x:
          type: number
          minimum: 0
          maximum: 100
        y:
          type: number
          minimum: 0
          maximum: 100
        zoom:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 10
    PublicationSaveInput:
      type: object
      required:
        - publication
      properties:
        publication:
          $ref: "#/components/schemas/PublicationFields"
        sourceSlug:
          type: string
          minLength: 1
          description: The slug that the editor loaded the record under.
    PublicationImageUpload:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          description: A base64 data URL of the image. It starts with `data:image/`.
          pattern: ^data:image/
    PublicationAuthorPhotoResult:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          description: The storage key, in the shape `author-<uuid>.webp`.
    PublicationPaperResult:
      type: object
      required:
        - key
        - size
      properties:
        key:
          type: string
          description: The storage key, in the shape `paper-<slug>-<uuid>.pdf`.
        size:
          type: integer
          description: Size of the stored file in bytes.
    PublicationOk:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    MemberRecordList:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/MemberRecord"
    MemberRecord:
      type: object
      description: A stored member profile with the slug and the time of its last save.
      required:
        - member
        - profile
        - slug
        - updatedAt
      properties:
        member:
          $ref: "#/components/schemas/MemberFields"
        profile:
          $ref: "#/components/schemas/MemberProfile"
        sourceSlug:
          type: string
          description: The slug that the record had before a rename. Present only on records that were renamed or saved with it.
        slug:
          type: string
          description: The slug of the record.
        updatedAt:
          type: string
          format: date-time
          description: The time of the last save. Send it back in `x-cms-expected-updated-at` to detect a concurrent save.
    MemberFields:
      type: object
      required:
        - accent
        - bio
        - division
        - group
        - hasPortrait
        - labFocus
        - name
        - role
        - slug
      properties:
        accent:
          type: string
          enum:
            - blue
            - yellow
            - red
            - green
        bio:
          type: string
        division:
          type: string
        group:
          type: string
        hasPortrait:
          type: boolean
        highlighted:
          type: boolean
          default: false
        labFocus:
          type: array
          items:
            type: string
        name:
          type: string
          minLength: 1
        nickname:
          type: string
        role:
          type: string
        slug:
          type: string
          minLength: 1
        unit:
          type: string
    MemberProfile:
      type: object
      description: The free form profile of a member, such as links, certificates and sections. The shape is open. The server only checks the links and the size.
      additionalProperties: true
      properties:
        links:
          type: array
          description: Profile links. A `url` that is not empty must start with `https://`, `http://`, `mailto:` or `tel:`.
          items:
            type: object
            additionalProperties: true
            properties:
              url:
                type: string
        certificates:
          type: array
          description: Certificates. A `credentialUrl` that is not empty must start with `https://`, `http://`, `mailto:` or `tel:`.
          items:
            type: object
            additionalProperties: true
            properties:
              credentialUrl:
                type: string
    MemberSaveInput:
      type: object
      required:
        - member
        - profile
      properties:
        member:
          $ref: "#/components/schemas/MemberFields"
        profile:
          $ref: "#/components/schemas/MemberProfile"
        sourceSlug:
          type: string
          minLength: 1
          description: The slug of the record to rename when the path slug does not exist.
    MemberImageUpload:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          description: A base64 data URL of the image. It starts with `data:image/`.
          pattern: ^data:image/
    MemberPhotoResult:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          description: The storage key, in the shape `member-<slug>-<uuid>.<ext>`.
    MemberOk:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    ShortLinkOk:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    ShortLinkHostList:
      type: object
      required:
        - hosts
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/ShortLinkHost"
    ShortLinkHost:
      type: object
      required:
        - hostname
        - status
      properties:
        hostname:
          type: string
          example: go.example.org
        status:
          $ref: "#/components/schemas/ShortLinkDomainState"
    ShortLinkDomainState:
      type: string
      description: A custom domain is `pending` until the verification TXT record and the marker page both pass.
      enum:
        - pending
        - connected
    ShortLinkResolution:
      description: The answer of a lookup. The `status` field picks the shape.
      oneOf:
        - $ref: "#/components/schemas/ShortLinkResolutionOk"
        - $ref: "#/components/schemas/ShortLinkResolutionPassphrase"
        - $ref: "#/components/schemas/ShortLinkResolutionNotFound"
        - $ref: "#/components/schemas/ShortLinkResolutionExpired"
      discriminator:
        propertyName: status
        mapping:
          ok: "#/components/schemas/ShortLinkResolutionOk"
          passphrase: "#/components/schemas/ShortLinkResolutionPassphrase"
          not_found: "#/components/schemas/ShortLinkResolutionNotFound"
          expired: "#/components/schemas/ShortLinkResolutionExpired"
    ShortLinkResolutionOk:
      type: object
      description: The link is open and the visitor may go to the target.
      required:
        - status
        - longUrl
      properties:
        status:
          type: string
          enum:
            - ok
        longUrl:
          type: string
          format: uri
    ShortLinkResolutionPassphrase:
      type: object
      description: The link has a passphrase. The visitor must send it to the verify route.
      required:
        - status
        - host
      properties:
        status:
          type: string
          enum:
            - passphrase
        host:
          type: string
          description: The host name in its normal form.
    ShortLinkResolutionNotFound:
      type: object
      description: No usable link matches the host and the slug.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - not_found
    ShortLinkResolutionExpired:
      type: object
      description: The link ran out of time or its single click was used.
      required:
        - status
        - kind
      properties:
        status:
          type: string
          enum:
            - expired
        kind:
          type: string
          description: The value `expired` means the time ran out. The value `consumed` means a single-use link was used.
          enum:
            - expired
            - consumed
    ShortLinkVerifyInput:
      type: object
      required:
        - slug
        - host
        - passphrase
      properties:
        slug:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,64}$
        host:
          type: string
          minLength: 1
          maxLength: 253
        passphrase:
          type: string
          minLength: 1
          maxLength: 200
    ShortLinkVerifyResult:
      type: object
      required:
        - longUrl
      properties:
        longUrl:
          type: string
          format: uri
    ShortLinkRecord:
      type: object
      description: A DNS record that a domain owner must create.
      required:
        - name
        - content
      properties:
        name:
          type: string
          example: go.example.org
        content:
          type: string
    ShortLinkDomainRecords:
      type: object
      description: The DNS records of a custom domain.
      required:
        - cname
        - verifyTxt
      properties:
        cname:
          type: object
          nullable: true
          description: The routing CNAME. It is null while the API has no routing target set.
          required:
            - name
            - content
          properties:
            name:
              type: string
              example: go.example.org
            content:
              type: string
        verifyTxt:
          allOf:
            - $ref: "#/components/schemas/ShortLinkRecord"
          description: The TXT record at `_mgm-verify.` plus the host name, which proves ownership.
    ShortLinkDomain:
      type: object
      required:
        - id
        - hostname
        - isPrimary
        - provider
        - status
        - lastUsedAt
        - createdAt
        - linkCount
      properties:
        id:
          type: string
        hostname:
          type: string
          example: go.example.org
        isPrimary:
          type: boolean
          description: True for the own domain of the site.
        provider:
          type: string
          description: The value `local` is the own domain of the site. The value `cloudflare` means the DNS zone is on Cloudflare. The value `manual` is any other DNS host.
          enum:
            - local
            - cloudflare
            - manual
        status:
          $ref: "#/components/schemas/ShortLinkDomainState"
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        linkCount:
          type: integer
          minimum: 0
        records:
          $ref: "#/components/schemas/ShortLinkDomainRecords"
    ShortLinkDomainList:
      type: object
      required:
        - domains
        - cnameTarget
      properties:
        domains:
          type: array
          items:
            $ref: "#/components/schemas/ShortLinkDomain"
        cnameTarget:
          type: string
          nullable: true
          description: The host name that a custom domain must point to. It is null when the API has none set.
    ShortLinkDomainInput:
      type: object
      required:
        - hostname
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 253
          description: A domain name. The API removes a scheme, a port, a path and a trailing dot, and makes it lowercase.
    ShortLinkDomainCreated:
      type: object
      required:
        - domain
      properties:
        domain:
          $ref: "#/components/schemas/ShortLinkDomain"
    ShortLinkDomainChecks:
      type: object
      required:
        - verifyTxt
        - marker
      properties:
        verifyTxt:
          type: boolean
          description: True when the verification TXT record matches the stored token.
        marker:
          type: boolean
          description: True when the domain serves the marker page of the site over HTTPS.
    ShortLinkDomainStatus:
      type: object
      required:
        - domain
        - checks
      properties:
        domain:
          $ref: "#/components/schemas/ShortLinkDomain"
        checks:
          $ref: "#/components/schemas/ShortLinkDomainChecks"
    ShortLinkConnect:
      type: object
      required:
        - url
        - records
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: The signed Domain Connect URL. It is null when the API has no signing key.
        records:
          type: object
          required:
            - cname
            - verifyTxt
          properties:
            cname:
              $ref: "#/components/schemas/ShortLinkRecord"
            verifyTxt:
              $ref: "#/components/schemas/ShortLinkRecord"
    ShortLinkExpiry:
      type: string
      description: The value `once` allows one click. The values `24h`, `3d`, `7d` and `30d` set a time limit from now. The value `never` removes any limit.
      enum:
        - once
        - 24h
        - 3d
        - 7d
        - 30d
        - never
    ShortLinkStatus:
      type: string
      description: The state of a link. The value `expired` wins over `error`. The value `consumed` is a single-use link that was used. The value `error` means the last check of the target URL failed.
      enum:
        - available
        - expired
        - consumed
        - error
    ShortLink:
      type: object
      required:
        - id
        - slug
        - longUrl
        - shortUrl
        - domainId
        - domainHost
        - status
        - clickCount
        - viewCount
        - hasPassphrase
        - expiresAt
        - maxClicks
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        slug:
          type: string
          example: launch
        longUrl:
          type: string
          format: uri
        shortUrl:
          type: string
          format: uri
          description: The public address. It is `/s/` plus the slug on the primary domain, and the slug alone on a custom domain.
        domainId:
          type: string
        domainHost:
          type: string
        status:
          $ref: "#/components/schemas/ShortLinkStatus"
        clickCount:
          type: integer
          minimum: 0
        viewCount:
          type: integer
          minimum: 0
        hasPassphrase:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
        maxClicks:
          type: integer
          nullable: true
          description: The click limit of a single-use link. It is null for other links.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ShortLinkList:
      type: object
      required:
        - links
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/ShortLink"
    ShortLinkEnvelope:
      type: object
      required:
        - link
      properties:
        link:
          $ref: "#/components/schemas/ShortLink"
    ShortLinkCreateInput:
      type: object
      required:
        - domainId
        - longUrl
      properties:
        domainId:
          type: string
          minLength: 1
        longUrl:
          type: string
          format: uri
          minLength: 1
          maxLength: 2000
          description: A full `http` or `https` URL. The API trims spaces around it.
        slug:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          description: The short code. An empty string counts as no slug. The API makes a random code when it is missing.
        expiresIn:
          allOf:
            - $ref: "#/components/schemas/ShortLinkExpiry"
          default: never
        passphrase:
          type: string
          minLength: 1
          maxLength: 200
          description: A passphrase that a visitor must enter. The API stores only a salted hash.
    ShortLinkUpdateInput:
      type: object
      properties:
        domainId:
          type: string
          minLength: 1
        longUrl:
          type: string
          format: uri
          minLength: 1
          maxLength: 2000
        slug:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,64}$
          description: An empty string counts as no slug and keeps the current one.
        expiresIn:
          $ref: "#/components/schemas/ShortLinkExpiry"
        passphraseAction:
          type: string
          description: The value `keep` leaves the passphrase alone. The value `set` stores the new passphrase and needs the field `passphrase`. Without it the stored passphrase stays. The value `remove` clears the passphrase.
          enum:
            - keep
            - set
            - remove
          default: keep
        passphrase:
          type: string
          minLength: 1
          maxLength: 200
    ShortLinkCount:
      type: object
      description: A value and the number of visits that had it.
      required:
        - visits
      properties:
        visits:
          type: integer
          minimum: 0
    ShortLinkTotals:
      type: object
      required:
        - views
        - clicks
        - uniqueIps
        - failedAttempts
      properties:
        views:
          type: integer
          minimum: 0
        clicks:
          type: integer
          minimum: 0
        uniqueIps:
          type: integer
          minimum: 0
        failedAttempts:
          type: integer
          minimum: 0
          description: The number of wrong passphrases.
    ShortLinkDay:
      type: object
      required:
        - day
        - views
        - clicks
      properties:
        day:
          type: string
          format: date
        views:
          type: integer
          minimum: 0
        clicks:
          type: integer
          minimum: 0
    ShortLinkVisit:
      type: object
      required:
        - id
        - ip
        - userAgent
        - referer
        - isView
        - isClick
        - failedAttempt
        - country
        - region
        - city
        - timezone
        - device
        - browser
        - os
        - createdAt
      properties:
        id:
          type: string
        ip:
          type: string
          nullable: true
          example: 203.0.113.1
        userAgent:
          type: string
          nullable: true
        referer:
          type: string
          nullable: true
        isView:
          type: boolean
        isClick:
          type: boolean
        failedAttempt:
          type: boolean
        country:
          type: string
          nullable: true
          description: The location fields are set only when the operator turned geolocation on.
        region:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        device:
          type: string
          nullable: true
        browser:
          type: string
          nullable: true
        os:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ShortLinkAnalytics:
      type: object
      required:
        - link
        - totals
        - days
        - countries
        - referrers
        - browsers
        - oss
        - devices
        - recent
      properties:
        link:
          $ref: "#/components/schemas/ShortLink"
        totals:
          $ref: "#/components/schemas/ShortLinkTotals"
        days:
          type: array
          description: The last 14 days, oldest first, with a zero row for a day without visits.
          items:
            $ref: "#/components/schemas/ShortLinkDay"
        countries:
          type: array
          description: The top 10 countries.
          items:
            allOf:
              - $ref: "#/components/schemas/ShortLinkCount"
              - type: object
                required:
                  - country
                properties:
                  country:
                    type: string
        referrers:
          type: array
          description: The top 10 referrer hosts from the latest 5000 visits that had a referer.
          items:
            allOf:
              - $ref: "#/components/schemas/ShortLinkCount"
              - type: object
                required:
                  - host
                properties:
                  host:
                    type: string
        browsers:
          type: array
          description: The top 8 browsers.
          items:
            allOf:
              - $ref: "#/components/schemas/ShortLinkCount"
              - type: object
                required:
                  - browser
                properties:
                  browser:
                    type: string
        oss:
          type: array
          description: The top 8 operating systems.
          items:
            allOf:
              - $ref: "#/components/schemas/ShortLinkCount"
              - type: object
                required:
                  - os
                properties:
                  os:
                    type: string
        devices:
          type: array
          description: The top 8 device types.
          items:
            allOf:
              - $ref: "#/components/schemas/ShortLinkCount"
              - type: object
                required:
                  - device
                properties:
                  device:
                    type: string
        recent:
          type: array
          description: The 50 latest visits, newest first.
          items:
            $ref: "#/components/schemas/ShortLinkVisit"
    JobOk:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    JobBlock:
      type: object
      description: One block of the BlockNote document. Fields that this schema does not name are kept as they are.
      required:
        - id
        - type
      additionalProperties: true
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        props:
          type: object
          additionalProperties: true
        content: {}
        children:
          type: array
          items: {}
    JobDetails:
      type: object
      required:
        - slug
        - title
        - focus
        - commitment
        - mode
        - deadline
        - perks
        - status
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: The URL slug. The values `admin`, `feed`, `media` and `applications` are reserved.
          example: frontend-engineer
        title:
          type: string
          minLength: 1
          maxLength: 200
        focus:
          type: string
          minLength: 1
          maxLength: 120
        commitment:
          type: string
          enum:
            - full-time
            - part-time
            - project
            - internship
            - volunteer
        mode:
          type: string
          enum:
            - onsite
            - remote
            - hybrid
        deadline:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: The last open day. The role stays open through this day, counted in UTC.
        perks:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 80
        status:
          type: string
          description: A draft is hidden from the public. A closed role still resolves by its slug and takes no applications.
          enum:
            - draft
            - published
            - closed
    JobInput:
      type: object
      required:
        - job
        - content
      properties:
        job:
          $ref: "#/components/schemas/JobDetails"
        content:
          type: array
          items:
            $ref: "#/components/schemas/JobBlock"
        sourceSlug:
          type: string
          minLength: 1
          description: Optional. The route takes the current slug from the path.
    JobRecord:
      type: object
      required:
        - job
        - content
        - slug
        - updatedAt
      properties:
        job:
          $ref: "#/components/schemas/JobDetails"
        content:
          type: array
          description: The document. It is empty in the public list.
          items:
            $ref: "#/components/schemas/JobBlock"
        slug:
          type: string
        updatedAt:
          type: string
          format: date-time
          description: Send this value in the header `x-cms-expected-updated-at` on the next save.
    JobList:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/JobRecord"
    JobEnvelope:
      type: object
      required:
        - record
      properties:
        record:
          $ref: "#/components/schemas/JobRecord"
    JobApplyInput:
      type: object
      required:
        - applicantType
        - fullName
        - email
        - phoneCountry
        - phoneNumber
        - motivation
        - agreedToTerms
        - cv
      properties:
        applicantType:
          type: string
          enum:
            - ub-student
            - general
        fullName:
          type: string
          minLength: 2
          maxLength: 200
          example: Ayu
        email:
          type: string
          format: email
          maxLength: 254
          example: ayu@example.org
        phoneCountry:
          type: string
          pattern: ^\+\d{1,3}$
          example: "+62"
        phoneNumber:
          type: string
          pattern: ^[0-9][0-9 ()-]{5,19}$
        nim:
          type: string
          maxLength: 30
          description: Required when `applicantType` is `ub-student`. It must have 15 digits that start with 2, or 10 digits for a lecturer number, or 18 digits for an employee number.
        faculty:
          type: string
          maxLength: 120
          description: Required when `applicantType` is `ub-student`.
        motivation:
          type: string
          minLength: 10
          maxLength: 8000
        agreedToTerms:
          type: string
          description: The checkbox value. It must be the text `true`.
          enum:
            - "true"
        cv:
          type: string
          format: binary
          description: A PDF, `.doc` or `.docx` file. The API takes the type from the content type of the part and not from the file name.
    JobApplicationDetails:
      type: object
      required:
        - applicantType
        - fullName
        - email
        - phoneCountry
        - phoneNumber
        - motivation
        - agreedToTerms
        - jobSlug
        - jobTitle
        - cvKey
        - cvFilename
        - cvContentType
        - read
        - readAt
        - status
      properties:
        applicantType:
          type: string
          enum:
            - ub-student
            - general
        fullName:
          type: string
        email:
          type: string
          format: email
        phoneCountry:
          type: string
        phoneNumber:
          type: string
        nim:
          type: string
          description: An empty string or a missing field for a general applicant.
        faculty:
          type: string
          description: An empty string or a missing field for a general applicant.
        motivation:
          type: string
        agreedToTerms:
          type: string
          enum:
            - "true"
        jobSlug:
          type: string
        jobTitle:
          type: string
          description: The title of the role at the time of the application.
        cvKey:
          type: string
        cvFilename:
          type: string
          description: The original file name without path characters. It is for display only.
        cvContentType:
          type: string
          enum:
            - application/pdf
            - application/msword
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        read:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - inbox
            - archived
    JobApplicationRecord:
      type: object
      required:
        - application
        - slug
        - createdAt
        - updatedAt
      properties:
        application:
          $ref: "#/components/schemas/JobApplicationDetails"
        slug:
          type: string
          description: The id of the application. It starts with `app-`.
          example: app-3f1c2b8e-0000-4000-8000-000000000001
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JobApplicationList:
      type: object
      required:
        - records
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/JobApplicationRecord"
    JobApplicationDetail:
      type: object
      required:
        - record
        - cvUrl
      properties:
        record:
          $ref: "#/components/schemas/JobApplicationRecord"
        cvUrl:
          type: string
          format: uri
          nullable: true
          description: A signed download URL that works for 15 minutes.
    JobApplicationEnvelope:
      type: object
      required:
        - record
      properties:
        record:
          type: object
          required:
            - application
            - slug
            - updatedAt
          properties:
            application:
              $ref: "#/components/schemas/JobApplicationDetails"
            slug:
              type: string
            updatedAt:
              type: string
              format: date-time
    JobApplicationStateInput:
      type: object
      description: At least one field is required.
      properties:
        read:
          type: boolean
        status:
          type: string
          enum:
            - inbox
            - archived
    JobApplicationBulkInput:
      type: object
      required:
        - ids
        - action
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            minLength: 1
        action:
          type: string
          enum:
            - archive
            - unarchive
            - markRead
            - markUnread
            - delete
    JobMediaInput:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          description: A base64 data URL such as `data:image/png;base64,` followed by the bytes. The type must be `image/png`, `image/jpeg` or `image/webp`.
    JobMediaKey:
      type: object
      required:
        - key
      properties:
        key:
          type: string
          example: job-frontend-engineer-3f1c2b8e-0000-4000-8000-000000000001.png
    ContactOk:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          enum:
            - true
    ContactAttachment:
      type: object
      required:
        - key
        - size
      properties:
        key:
          type: string
          pattern: ^contact-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:-[a-z0-9-]{1,60})?(?:\.[a-z0-9]{1,10})?$
        size:
          type: integer
          minimum: 1
          description: The size in bytes.
    ContactMessageInput:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The API trims spaces around the value.
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 320
        company:
          type: string
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 5000
        attachmentKeys:
          type: array
          maxItems: 5
          description: Keys from the attachment upload route.
          items:
            type: string
            pattern: ^contact-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?:-[a-z0-9-]{1,60})?(?:\.[a-z0-9]{1,10})?$
    ContactValidationError:
      type: object
      description: The validation error of this route. It does not use the default error body.
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: object
          description: A list of messages for each field that failed.
          additionalProperties:
            type: array
            items:
              type: string
