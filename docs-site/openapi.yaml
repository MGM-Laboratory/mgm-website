      responses:
        "201":
          description: The coordinates that the link holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCoordinates"
              example:
                lat: 0.0
                lng: 0.0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
