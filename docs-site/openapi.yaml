      description: Takes the raw bytes of an MP4 or WebM file. Set the `Content-Type` header to `video/mp4` or `video/webm`. The server checks the passphrase before it reads the body, checks the first bytes of the file, and refuses a file over the size limit. The default limit is 500 MB and the operator can set it up to 1 GiB with `CMS_MAX_VIDEO_BYTES`.
