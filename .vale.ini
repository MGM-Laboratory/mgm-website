StylesPath = .github/vale/styles
MinAlertLevel = suggestion
Packages = Google

[*.md]
BasedOnStyles = Vale, Google, MGM
Vale.Spelling = NO
Google.EmDash = NO
Google.Parens = NO
# Wants a maintained Vocab (accept.txt) of every proper noun that can follow a
# colon to avoid false positives; our docs list a product/tool name after a
# colon constantly (CodeQL, Playwright, SonarCloud...), so it fires near-always.
Google.Colons = NO
