name: Bug report
description: Something on the site or API is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://web-production-589d3f.up.railway.app/...
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: Chrome 130 / macOS 15
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / logs
