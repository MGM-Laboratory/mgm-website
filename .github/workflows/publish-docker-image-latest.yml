name: Publish Docker Images (latest)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  id-token: write
  attestations: write
  security-events: write

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/detect-changes.yml

  build:
    needs: changes
    if: needs.changes.outputs.docker_api == 'true' || needs.changes.outputs.docker_web == 'true'
    uses: ./.github/workflows/publish-docker-image.yml
    with:
      tag: latest
    secrets: inherit

  gate:
    name: Docker latest gate
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (jobs.changes.result !== "success" || Object.values(jobs).some(j => !["success", "skipped"].includes(j.result))) process.exit(1)'
