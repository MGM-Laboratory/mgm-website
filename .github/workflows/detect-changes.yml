name: Detect Changes

on:
  workflow_call:
    outputs:
      code:
        description: Whether any changed file falls outside docs/license paths.
        value: ${{ jobs.detect.outputs.code }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect docs-only changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # Only push/pull_request carry a diffable base — other triggers
      # (workflow_dispatch, schedule) always report code=true below so a
      # manual run or the /merge post-merge verification dispatch never
      # gets silently skipped.
      - name: Checkout
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20

      - name: Filter changed paths
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
              - "!LICENSE"

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
