name: PR Comment Commands

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  actions: write

concurrency:
  group: pr-commands-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.issue.pull_request != null || github.event_name == 'pull_request_review'
    name: Handle PR comment command
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate a bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      # COMMENT_BODY is untrusted, attacker-controlled text — it only ever
      # reaches this job as a Node environment variable (process.env), never
      # interpolated into a shell command string, so it can't inject anything.
      - name: Handle command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login || github.event.review.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association || github.event.review.author_association }}
        run: node .github/scripts/pr-command.mjs
