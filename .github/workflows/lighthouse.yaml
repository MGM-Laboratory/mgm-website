name: Lighthouse

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      contents: read
      pull-requests: read

  lighthouse:
    name: Lighthouse CI budget
    needs: changes
    if: needs.changes.outputs.lighthouse == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm turbo run build --filter=web

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.x autorun --config=.lighthouserc.json

      # A separate, best-effort step: the gate below only reads this job's
      # own exit code, which the autorun step above already determined via
      # its assertions. `if: !cancelled()` makes it still run after autorun
      # fails (a step only runs if the prior one succeeded by default), so a
      # failing URL still gets a status showing what failed, not silence. If
      # posting these per-URL GitHub status checks fails itself (bad token,
      # revoked permission), continue-on-error keeps that failure from ever
      # reaching the job's exit code, and therefore the gate, since it's
      # purely additional visibility, not a merge signal.
      - name: Post Lighthouse GitHub status checks
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm dlx @lhci/cli@0.15.x upload --target=temporary-public-storage --githubToken="$LHCI_GITHUB_TOKEN"
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    name: Lighthouse gate
    if: always()
    needs: [changes, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (jobs.changes.result !== "success" || Object.values(jobs).some(j => !["success", "skipped"].includes(j.result))) process.exit(1)'
