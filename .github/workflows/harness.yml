name: Harness

on:
  # pull_request_target, not pull_request: this job never checks out or runs
  # PR code — it only tells Harness which commit SHA to clone and build on
  # Harness's own infrastructure, then relays the result back as a commit
  # status. That needs HARNESS_API_KEY, which pull_request withholds from
  # fork PRs; pull_request_target still runs the trusted main-branch version
  # of this file with full secrets, which is safe precisely because it does
  # nothing with the PR's own code.
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: harness-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  harness-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pipeline_id: harness_ci
            status_context: harness/ci
          - pipeline_id: harness_security
            status_context: harness/security
          - pipeline_id: harness_supply_chain
            status_context: harness/supply-chain
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Run and report
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PIPELINE_ID: ${{ matrix.pipeline_id }}
          STATUS_CONTEXT: ${{ matrix.status_context }}
        run: node .github/scripts/harness-check.mjs
