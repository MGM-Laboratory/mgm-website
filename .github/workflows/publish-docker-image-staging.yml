name: Publish Docker Images (staging)

on:
  pull_request:
    branches: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  security-events: write

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/detect-changes.yml

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/publish-docker-image.yml
    with:
      # workflow_dispatch has no PR number, so fall back to the run number.
      tag: pr-${{ github.event.pull_request.number || github.run_number }}
    secrets: inherit
