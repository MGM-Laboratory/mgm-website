name: Publish Docker Images (staging)

on:
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build-api:
    uses: ./.github/workflows/publish-docker-image-api.yml
    with:
      tag: staging
    secrets: inherit

  build-web:
    uses: ./.github/workflows/publish-docker-image-web.yml
    with:
      tag: staging
    secrets: inherit
