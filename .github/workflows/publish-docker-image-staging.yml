name: Publish Docker Images (staging)

on:
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    # A reusable workflow that has never been merged to the default branch
    # can't be resolved by a pull_request-triggered run yet, regardless of
    # local vs. remote-pinned syntax - this fails until this PR's first
    # merge, then works normally (including picking up future in-PR edits
    # to publish-docker-image.yml, which a "@main" pin never would).
    uses: ./.github/workflows/publish-docker-image.yml
    with:
      # workflow_dispatch has no PR number, so fall back to the run number.
      tag: pr-${{ github.event.pull_request.number || github.run_number }}
    secrets: inherit
