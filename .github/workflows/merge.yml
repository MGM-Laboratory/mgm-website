name: Merge

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to check and merge
        required: true

concurrency:
  group: merge-pr-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  # write, not read: dispatching ci.yaml/publish-docker-image-latest.yml
  # against the merge commit (POST .../dispatches) needs actions:write —
  # read-only 403s on that call.
  actions: write

jobs:
  # Everything here is API-driven — no PR code is ever checked out or run,
  # so this is safe even against a fork PR with write-scoped secrets in
  # scope.
  merge:
    name: Check readiness and merge PR
    runs-on: ubuntu-latest
    steps:
      - name: Validate pr_number
        run: |
          if ! [[ "${{ github.event.inputs.pr_number }}" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a plain integer"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate a bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Check readiness, merge, clean up, verify production
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ steps.app-token.outputs.token }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/pr-merge.mjs
