name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/detect-changes.yml
    permissions:
      contents: read
      pull-requests: read

  e2e:
    name: Playwright (${{ matrix.os }}, ${{ matrix.project }})
    needs: changes
    # No job-level `if:` here on purpose: a skipped matrix job never expands
    # its matrix, so GitHub posts a single check-run under the raw,
    # unexpanded name template instead of one per (os, project) combination.
    # The ruleset requires each expanded name individually, so that
    # mismatch would leave those 7 checks permanently unsatisfiable on a
    # docs-only PR. Gating every step instead keeps the job (and its
    # matrix) always running, so the right names always get posted, just
    # near-instant and effectively a no-op when e2e-relevant files didn't
    # change.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: chromium
          - os: ubuntu-latest
            project: firefox
          - os: ubuntu-latest
            project: webkit
          - os: ubuntu-latest
            project: mobile-chrome
          - os: ubuntu-latest
            project: mobile-safari
          - os: windows-latest
            project: chromium
          - os: macos-latest
            project: webkit
    runs-on: ${{ matrix.os }}
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      CI: true
    steps:
      - name: Checkout
        if: needs.changes.outputs.e2e == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        if: needs.changes.outputs.e2e == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: needs.changes.outputs.e2e == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.e2e == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: needs.changes.outputs.e2e == 'true'
        run: pnpm --filter web exec playwright install --with-deps ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project == 'mobile-safari' && 'webkit' || matrix.project }}

      - name: Build web
        if: needs.changes.outputs.e2e == 'true'
        run: pnpm turbo run build --filter=web

      - name: Run Playwright tests
        if: needs.changes.outputs.e2e == 'true'
        run: pnpm --filter web exec playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ needs.changes.outputs.e2e == 'true' && !cancelled() }}
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload updated snapshots (only produced on mismatch/missing)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ needs.changes.outputs.e2e == 'true' && !cancelled() && matrix.project == 'chromium' && matrix.os == 'ubuntu-latest' }}
        with:
          name: visual-snapshots-actual
          path: apps/web/e2e/**/*-actual.png
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: E2E gate
    if: always()
    needs: [changes, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (jobs.changes.result !== "success" || Object.values(jobs).some(j => !["success", "skipped"].includes(j.result))) process.exit(1)'
