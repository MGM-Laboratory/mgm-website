name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/detect-changes.yml

  e2e:
    name: Playwright (${{ matrix.os }}, ${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            project: chromium
          - os: ubuntu-latest
            project: firefox
          - os: ubuntu-latest
            project: webkit
          - os: ubuntu-latest
            project: mobile-chrome
          - os: ubuntu-latest
            project: mobile-safari
          - os: windows-latest
            project: chromium
          - os: macos-latest
            project: webkit
    runs-on: ${{ matrix.os }}
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project == 'mobile-safari' && 'webkit' || matrix.project }}

      - name: Build web
        run: pnpm turbo run build --filter=web

      - name: Run Playwright tests
        run: pnpm --filter web exec playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.project }}
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload updated snapshots (only produced on mismatch/missing)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && matrix.project == 'chromium' && matrix.os == 'ubuntu-latest' }}
        with:
          name: visual-snapshots-actual
          path: apps/web/e2e/**/*-actual.png
          if-no-files-found: ignore
          retention-days: 14
