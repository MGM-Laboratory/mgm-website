name: Optimize Images

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

concurrency:
  group: optimize-images
  cancel-in-progress: false

permissions: {}

jobs:
  # This job runs tools that are fetched at run time (apt, a release binary and an npm package with its dependencies).
  # It has no environment and no secret, so none of that code can reach the key of the release App. It hands the result
  # to the next job as a patch.
  optimize:
    name: Optimize images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      # renovate: datasource=npm depName=svgo
      SVGO_VERSION: 4.1.0
      # oxipng is a release binary, so Renovate cannot update it. Change the version and the checksum together.
      OXIPNG_VERSION: 10.2.1
      OXIPNG_SHA256: 1813750ef592c5350ca79c88f98b2c0876d05c826dc7156245256d4255c1ad17
      # Install scripts of the npm dependencies of svgo do not run
      npm_config_ignore_scripts: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends jpegoptim
          curl -fsSL -o oxipng.tar.gz "https://github.com/oxipng/oxipng/releases/download/v${OXIPNG_VERSION}/oxipng-${OXIPNG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${OXIPNG_SHA256}  oxipng.tar.gz" | sha256sum --check --strict
          tar -xzf oxipng.tar.gz --strip-components=1 --wildcards '*/oxipng'
          sudo install -m 0755 oxipng /usr/local/bin/oxipng
          rm oxipng.tar.gz oxipng
          oxipng --version
          jpegoptim --version | head -n 1

      # Nothing here makes a visible change to an image. PNG files are recompressed and keep every chunk that stays valid,
      # which is oxipng's default. JPEG files lose only comments, IPTC and XMP data, so the color profile and the EXIF
      # orientation stay. SVG files go through svgo with .github/svgo.config.mjs, which can round numbers in paths.
      # WebP files are left alone, because a lossless pass over a lossy file only makes it bigger.
      # Only the images of the web app are touched. The visual test snapshots and the e2e fixtures live outside these
      # folders, so a run never changes what a test compares against.
      - name: Optimize the images
        run: |
          set -euo pipefail
          list() { git ls-files -z -- apps/web/public apps/web/src | { grep -ziE "$1" || true; }; }
          list '\.png$' | xargs -0 -r oxipng --opt 4 --quiet
          list '\.jpe?g$' | xargs -0 -r jpegoptim --all-progressive --strip-com --strip-iptc --strip-xmp --quiet
          list '\.svg$' | xargs -0 -r npm exec --yes --package="svgo@${SVGO_VERSION}" -- svgo --config .github/svgo.config.mjs --quiet
          # svgo writes a file with no final newline, and the end-of-file check of pre-commit.ci fails on that
          list '\.svg$' | xargs -0 -r -n 1 sh -c 'if [ -n "$(tail -c 1 "$1")" ]; then printf "\n" >> "$1"; fi' sh
          git status --short

      - name: Collect the changes as a patch
        id: diff
        run: |
          git diff --binary > "${RUNNER_TEMP}/images.patch"
          if [ -s "${RUNNER_TEMP}/images.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-patch
          path: ${{ runner.temp }}/images.patch
          if-no-files-found: error
          retention-days: 1

  # This job only applies the patch and opens the pull request. The private key of the App is a secret of the release
  # environment, which only main can use, so a manual run from another branch is refused here.
  pull-request:
    name: Open the pull request
    needs: optimize
    if: needs.optimize.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions: {}
    steps:
      # A pull request that the default GITHUB_TOKEN opens does not start the checks, and its commits are not signed by GitHub.
      # The token of the release App fixes both, and the ruleset of main requires signed commits.
      - name: Create a token for the release app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-patch
          path: ${{ runner.temp }}

      # The patch can only change image files of the web app. This stops the step if it holds anything else.
      - name: Apply the patch
        run: |
          set -euo pipefail
          git apply --numstat "${RUNNER_TEMP}/images.patch" | cut -f3 | { grep -vE '^apps/web/(public|src)/.+\.(png|jpe?g|svg)$' || true; } > "${RUNNER_TEMP}/unexpected.txt"
          if [ -s "${RUNNER_TEMP}/unexpected.txt" ]; then
            echo "The patch changes files that are not images of the web app:"
            cat "${RUNNER_TEMP}/unexpected.txt"
            exit 1
          fi
          git apply "${RUNNER_TEMP}/images.patch"
          git status --short

      - name: Open the pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: chore/optimize-images
          delete-branch: true
          commit-message: "chore(images): optimize images"
          title: "chore(images): optimize images"
          body: "- chore(images): optimize images"
          labels: enhancement
          assignees: SyafaHadyan
