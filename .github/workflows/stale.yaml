name: Stale

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: false

jobs:
  stale:
    name: Label and close inactive issues/PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue hasn't had activity in 30 days and will be closed in 7 days
            if nothing changes. Comment if it's still relevant.
          stale-pr-message: >
            This PR hasn't had activity in 30 days and will be closed in 7 days
            if nothing changes. Comment or push a commit to keep it open.
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
