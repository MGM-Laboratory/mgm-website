name: Vale

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vale-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    uses: ./.github/workflows/detect-changes.yml

  vale:
    name: Vale prose lint
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vale
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          reporter: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'local' || 'github-check' }}
          # nofilter: check every configured file in full on every run, not just
          # lines touched by a PR's diff (the default filter_mode: added would
          # let a pre-existing violation elsewhere in a touched file slip past).
          # This only became safe to turn on once the pre-existing dash backlog
          # was fully cleaned out; before that, fail_on_error was gated to
          # pull_request events specifically to keep this same full-file scan
          # from failing every push to main against that backlog (reviewdog
          # forces nofilter on push/workflow_dispatch regardless of this
          # setting anyway, since it has no PR to diff against on those
          # events: reviewdog/reviewdog cmd/reviewdog/main.go, `if !isPR {
          # opt.filterMode = filter.ModeNoFilter }`).
          filter_mode: nofilter
          fail_on_error: true
          # The full configured corpus has hundreds of non-blocking
          # suggestions and warnings. Posting all of them exceeds GitHub's
          # 65,535-character check-output limit, so send only the gate level.
          min_alert_level: error
          level: warning
          # A newline separator looks tidier as a multi-line `files:` block,
          # but @actions/core's getInput() trims all whitespace (including
          # newlines) from every input by default, so a "\n" separator comes
          # through as "" at runtime and vale-action silently falls back to
          # scanning the whole working directory. Comma survives the trim.
          separator: ","
          files: "README.md,AGENTS.md,CLAUDE.md,DESIGN_SYSTEM.md,CODE_OF_CONDUCT.md,CONTRIBUTING.md,GOVERNANCE.md,SECURITY.md,.github/pull_request_template.md,apps/api/README.md,apps/web/README.md,docs"

  gate:
    name: Prose gate
    if: always()
    needs: [changes, vale]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (jobs.changes.result !== "success" || Object.values(jobs).some(j => !["success", "skipped"].includes(j.result))) process.exit(1)'
