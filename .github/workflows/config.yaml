name: Config lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A run is never cancelled, because GitHub keeps a cancelled run of a required check as unmet and the pull request stays blocked
concurrency:
  group: config-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The image is the actionlint stage of .github/tools/Dockerfile, which the update bot keeps current
      - name: Lint workflows
        run: |
          image="$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh actionlint)")"
          docker run --rm -v "$PWD:/repo" -w /repo "$image" -color

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        # the token lets the audits that ask GitHub about the actions in use run, such as the ones for known vulnerable
        # versions and for commits that are not on the branch they claim, which are skipped without it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo "$(bash ./.github/tools/image.sh zizmor)" \
            --no-progress --format github .

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      - name: Lint the Dockerfiles
        run: |
          image="$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh hadolint)")"
          status=0
          for dockerfile in apps/api/Dockerfile apps/web/Dockerfile; do
            echo "== $dockerfile"
            docker run --rm -i -v "$PWD/.hadolint.yml:/etc/hadolint.yaml:ro" "$image" /bin/hadolint --config /etc/hadolint.yaml - < "$dockerfile" || status=1
          done
          exit "$status"

  dotenv:
    name: Dotenv lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The example files list the settings in the order of the code that reads them and not in alphabetical order, so the
      # check for the order of the keys is off
      - name: Lint the example env files
        run: |
          image="$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh dotenv-linter)")"
          docker run --rm -v "$PWD:/app:ro" -w /app "$image" \
            check --skip-updates --plain --ignore-checks UnorderedKey .env.example apps/api/.env.example apps/web/.env.example deploy/.env.example

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker compose config reads the file and builds nothing and starts nothing. The copy of the example file lets the variables
      # without a default resolve, because a variable without a default stops compose, which is the point of the check.
      - name: Check the compose files
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=example ADMIN_PASSPHRASE=example SESSION_SECRET=example docker compose -f docker-compose.yml config --quiet
          cp deploy/.env.example deploy/.env
          IMAGE_TAG=0.0.0 docker compose -f deploy/compose.production.example.yml config --quiet

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # every file that git tracks with the .sh ending and every Husky hook, which has no ending and no shebang, the settings are in .shellcheckrc
      - name: ShellCheck
        run: |
          image="$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh shellcheck)")"
          mapfile -d '' files < <(git ls-files -z '*.sh' ':(glob).husky/*')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "The repository has no shell file yet."
            exit 0
          fi
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$image" "${files[@]}"

  names:
    name: File names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # ls-lint reads the names of the files and never opens one, the rules are in .ls-lint.yml
      - name: Check the names of the files
        env:
          # renovate: datasource=npm depName=@ls-lint/ls-lint
          version: 2.3.2
        run: npx --yes "@ls-lint/ls-lint@${version}"

  renovate:
    name: Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The renovate package accepts only Node 24 (its engines field is ^24.11.0), so this job does not follow .node-version
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # A broken renovate.json does not fail anything by itself, the bot just stops opening dependency pull requests. The strict
      # mode also fails on an option that was renamed or removed, which the bot would only migrate with a warning
      - name: Validate renovate.json
        env:
          # renovate: datasource=npm depName=renovate
          version: 44.181.7
        run: npx --yes --package "renovate@${version}" renovate-config-validator --strict

  # The one check that the ruleset requires, so a job can be added or renamed here without a change of the ruleset
  gate:
    name: Config gate
    if: always()
    needs: [actionlint, zizmor, hadolint, dotenv, compose, shellcheck, names, renovate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(j => j.result !== "success")) process.exit(1)'
