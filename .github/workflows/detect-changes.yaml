name: Detect Changes

on:
  workflow_call:
    outputs:
      api:
        description: Whether the api workload is affected.
        value: ${{ jobs.detect.outputs.api }}
      web:
        description: Whether the web workload is affected.
        value: ${{ jobs.detect.outputs.web }}
      e2e:
        description: Whether the e2e workload is affected.
        value: ${{ jobs.detect.outputs.e2e }}
      lighthouse:
        description: Whether the lighthouse workload is affected.
        value: ${{ jobs.detect.outputs.lighthouse }}
      prose:
        description: Whether the prose workload is affected.
        value: ${{ jobs.detect.outputs.prose }}
      dependencies:
        description: Whether the dependencies workload is affected.
        value: ${{ jobs.detect.outputs.dependencies }}
      codeql:
        description: Whether the codeql workload is affected.
        value: ${{ jobs.detect.outputs.codeql }}
      trivy:
        description: Whether the trivy workload is affected.
        value: ${{ jobs.detect.outputs.trivy }}
      docker_api:
        description: Whether the docker_api workload is affected.
        value: ${{ jobs.detect.outputs.docker_api }}
      docker_web:
        description: Whether the docker_web workload is affected.
        value: ${{ jobs.detect.outputs.docker_web }}
      automation:
        description: Whether the automation workload is affected.
        value: ${{ jobs.detect.outputs.automation }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect affected workloads
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.scope.outputs.api }}
      web: ${{ steps.scope.outputs.web }}
      e2e: ${{ steps.scope.outputs.e2e }}
      lighthouse: ${{ steps.scope.outputs.lighthouse }}
      prose: ${{ steps.scope.outputs.prose }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      codeql: ${{ steps.scope.outputs.codeql }}
      trivy: ${{ steps.scope.outputs.trivy }}
      docker_api: ${{ steps.scope.outputs.docker_api }}
      docker_web: ${{ steps.scope.outputs.docker_web }}
      automation: ${{ steps.scope.outputs.automation }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/detect-changes.mjs
