name: Preview Teardown

on:
  # pull_request_target (not pull_request): this always runs the workflow
  # file from main with full secrets, regardless of which fork opened the
  # PR — safe here because the job never checks out or executes PR code, it
  # only calls the Railway API with the PR number from the event payload.
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Tear down PR preview environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Always checks out main, never fork code - see "Security-scanner
        # suppressions" in docs/ci-cd.md for why S7631 is suppressed below.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 - NOSONAR: githubactions:S7631, see docs/ci-cd.md
        with:
          ref: main

      - name: Delete preview environment (if any)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/preview-teardown.mjs
